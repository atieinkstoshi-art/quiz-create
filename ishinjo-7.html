<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>医療情報システム学 第7回｜暗記＆対決ゲーム</title>
<style>
  :root{
    --blue:#185FA5; --blue-d:#0f4176; --ok:#3B6D11; --ng:#A32D2D;
    --bg:#f4f6f9; --card:#ffffff; --ink:#1b2733; --sub:#5b6b7b; --line:#e2e8f0;
    --gold:#c8912a; --purple:#6d3fb0; --teal:#0f8b8d;
    --lv-b:#2e8b57; --lv-s:#2f6ea5; --lv-a:#9c3d8f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1720; --card:#18232f; --ink:#e8eef4; --sub:#9fb0c0; --line:#2a3a4a; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; padding:0 14px 92px; position:relative;}
  h1,h2,h3{margin:0;}
  .muted{color:var(--sub);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:12px 0;
    box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .btn{display:block; width:100%; border:none; border-radius:12px; padding:14px; font-size:16px; font-weight:700;
    background:var(--blue); color:#fff; cursor:pointer; margin:8px 0; transition:transform .05s;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent; color:var(--blue); border:2px solid var(--blue);}
  .btn.sm{padding:10px; font-size:14px;}
  .choice{display:block; width:100%; text-align:left; border:2px solid var(--line); border-radius:12px;
    padding:14px; font-size:16px; background:var(--card); color:var(--ink); margin:8px 0; cursor:pointer; font-weight:600;}
  .choice:active{transform:scale(.99);}
  .choice.correct{border-color:var(--ok); background:rgba(59,109,17,.12); color:var(--ok);}
  .choice.wrong{border-color:var(--ng); background:rgba(163,45,45,.12); color:var(--ng);}
  .choice.dim{opacity:.5;}
  .choice .cbx{display:inline-block;width:20px;height:20px;border:2px solid var(--line);border-radius:5px;margin-right:8px;vertical-align:-4px;}
  .choice.sel .cbx{background:var(--blue);border-color:var(--blue);}
  .brow{font-size:12px; letter-spacing:.12em; font-weight:800; color:var(--blue); text-transform:uppercase;}
  .pill{display:inline-block; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;
    background:rgba(24,95,165,.12); color:var(--blue); margin:2px 4px 2px 0;}
  .pill.b{background:rgba(46,139,87,.15);color:var(--lv-b);}
  .pill.s{background:rgba(47,110,165,.15);color:var(--lv-s);}
  .pill.a{background:rgba(156,61,143,.15);color:var(--lv-a);}
  .timerbar{height:8px; border-radius:999px; background:var(--line); overflow:hidden; margin:10px 0;}
  .timerbar > i{display:block; height:100%; background:var(--blue); width:100%; transition:width 1s linear;}
  .hd{display:flex; align-items:center; justify-content:space-between; padding:16px 2px 4px;}
  .hd .t{font-size:20px; font-weight:800;}
  .kpi{display:flex; gap:8px; flex-wrap:wrap;}
  .kpi .k{flex:1 1 30%; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center;}
  .kpi .k b{display:block; font-size:22px; color:var(--blue);}
  .kpi .k span{font-size:11px; color:var(--sub);}
  .nav{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; max-width:480px; margin:0 auto; z-index:10;}
  .nav button{flex:1; border:none; background:none; padding:8px 2px 10px; font-size:10px; font-weight:700;
    color:var(--sub); cursor:pointer;}
  .nav button .ic{display:block; font-size:20px; line-height:1.3;}
  .nav button.on{color:var(--blue);}
  input.txt,select.txt{width:100%; padding:13px; border:2px solid var(--line); border-radius:12px; font-size:16px;
    background:var(--card); color:var(--ink);}
  .flash{min-height:200px; display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:22px; font-weight:800; padding:24px; cursor:pointer; user-select:none;}
  .flash small{display:block; font-size:13px; font-weight:600; color:var(--sub); margin-top:14px;}
  .row2{display:flex; gap:8px;}
  .row2 .btn{margin:8px 0;}
  .row3{display:flex; gap:6px;}
  .chip{display:inline-block; border:2px solid var(--blue); color:var(--blue); background:var(--card);
    border-radius:999px; padding:8px 14px; margin:4px; font-weight:700; cursor:pointer; font-size:15px;}
  .chip.used{opacity:.35; pointer-events:none;}
  .blank{display:inline-block; min-width:88px; border-bottom:3px solid var(--blue); text-align:center;
    font-weight:800; color:var(--blue); margin:0 3px; cursor:pointer;}
  .grow{font-size:15px; font-weight:800;}
  .grow.up{color:var(--ok);} .grow.same{color:var(--sub);}
  .lvlseg{display:flex;gap:6px;margin:10px 0;}
  .lvlseg button{flex:1;border:2px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;
    padding:9px 4px;font-weight:800;font-size:13px;cursor:pointer;}
  .lvlseg button.on{color:#fff;}
  .lvlseg button.on.b{background:var(--lv-b);border-color:var(--lv-b);}
  .lvlseg button.on.s{background:var(--lv-s);border-color:var(--lv-s);}
  .lvlseg button.on.a{background:var(--lv-a);border-color:var(--lv-a);}
  .lvlseg button.on.m{background:var(--blue);border-color:var(--blue);}
  /* components (病院情報システム) map */
  .comps{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .comp{border:2px solid var(--line); border-radius:12px; padding:10px 8px; position:relative; overflow:hidden;}
  .comp .fill{position:absolute; left:0; bottom:0; width:100%; background:rgba(24,95,165,.16); transition:height .6s;}
  .comp.lit{border-color:var(--gold); box-shadow:0 0 0 2px rgba(200,145,42,.4);}
  .comp .em{font-size:22px; position:relative;}
  .comp .nm{font-size:12px; font-weight:800; position:relative; margin-top:2px; line-height:1.25;}
  .comp .vv{font-size:11px;color:var(--sub);position:relative;}
  .gauge{height:26px; border-radius:999px; background:var(--line); overflow:hidden;}
  .gauge > i{display:block; height:100%; background:linear-gradient(90deg,var(--blue),var(--ok)); width:0; transition:width .6s;}
  .teambar{display:flex; align-items:center; gap:8px; margin:6px 0;}
  .teambar .lab{width:70px; font-weight:800; font-size:13px;}
  .teambar .bwrap{flex:1; background:var(--line); border-radius:999px; height:22px; overflow:hidden;}
  .teambar .bwrap > i{display:block; height:100%; border-radius:999px; transition:width .5s;}
  .teambar .val{width:40px; text-align:right; font-weight:800; font-size:13px;}
  .teambar .rk{width:26px;font-weight:900;font-size:15px;text-align:center;}
  .tier{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;}
  .tier.done{border-color:var(--gold);background:rgba(200,145,42,.08);}
  .tier .em{font-size:26px;}
  .tier.locked{opacity:.5;}
  .badge{display:inline-flex;flex-direction:column;align-items:center;width:64px;margin:6px;}
  .badge .b{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;
    justify-content:center;font-size:26px;background:var(--card);}
  .badge.on .b{border-color:var(--gold);box-shadow:0 0 0 2px rgba(200,145,42,.35);}
  .badge.off .b{filter:grayscale(1);opacity:.4;}
  .badge small{font-size:10px;margin-top:3px;text-align:center;line-height:1.1;color:var(--sub);}
  /* screen (projector) mode */
  body.screen #app{max-width:1180px; padding:20px 30px;}
  body.screen{font-size:20px;}
  body.screen .scr-title{font-size:34px; font-weight:900; text-align:center; margin:4px 0 14px;}
  body.screen .scr-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start;}
  body.screen .comp .em{font-size:40px;} body.screen .comp .nm{font-size:17px;}
  body.screen .teambar .lab{width:120px; font-size:22px;}
  body.screen .teambar .bwrap{height:38px;} body.screen .teambar .val{width:64px; font-size:22px;}
  body.screen .teambar .rk{width:40px;font-size:26px;}
  body.screen .gauge{height:40px;}
  .banner{background:rgba(24,95,165,.1); border:1px dashed var(--blue); border-radius:12px; padding:10px 12px;
    font-size:13px; color:var(--blue); font-weight:700; margin:10px 0;}
  table.dash{width:100%; border-collapse:collapse; font-size:13px;}
  table.dash th,table.dash td{border-bottom:1px solid var(--line); padding:7px 6px; text-align:left;}
  table.dash td.n,table.dash th.n{text-align:right; font-variant-numeric:tabular-nums;}
  .barmini{height:8px; background:var(--line); border-radius:4px; overflow:hidden;}
  .barmini>i{display:block; height:100%; background:var(--ng);}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{border:2px solid var(--line);background:var(--card);color:var(--sub);border-radius:9px;padding:7px 10px;
    font-weight:800;font-size:12px;cursor:pointer;}
  .seg button.on{background:var(--blue);border-color:var(--blue);color:#fff;}
  .fbcard{text-align:center;border-radius:14px;padding:14px;margin:10px 0;border:2px solid var(--line);}
</style>
</head>
<body>
<div id="app"><div id="screen"></div></div>
<div class="nav" id="nav"></div>

<script>
/* ============================================================
   医療情報システム学 第7回 — 暗記＆対決ゲーム
   単一HTML / 素JS。localStorageで単体動作、GAS_URLを設定するとクラス共有（40人同時対応・GAS v3設計）。
   ▼ 学生画面には「個人の絶対順位」を出さない（教育理念・オーナー指示 2026-07-17）。
     学生が見られるのは：チーム順位・クラス協力・自己ベスト/成長・連続記録・難易度別バッジ。

/* ---- 設定（配布時に差し替え） ---- */
const GAS_URL   = "https://script.google.com/macros/s/AKfycbxd6rw5Llu-cxmdQazIuHBfonWvjpMrimTqi9ocgaZtBkpF6fMWvAwyjhUjkLlUOyuM/exec"; // クラス共有バックエンド(GAS)。空ならこの端末のlocalStorageのみ
const ADMIN_PW  = "sensei2025";          // 教員ダッシュボードのパスワード

const TITLE     = "医療情報システム学";
const SUBTITLE  = "第7回・医療情報技師 問41〜60＋標準規格";

/* 難易度：得点倍率（基礎から応用まで。応用ほど高得点＝挑戦のインセンティブ） */
const LVL = ["基礎","標準","応用"];
const LVL_MULT = {"基礎":1, "標準":1.5, "応用":2};
const LVL_CLASS = {"基礎":"b", "標準":"s", "応用":"a"};

/* クラス協力：段階的に上がる特典（特典をあげていく）。at=クラス合計正解数のしきい値 */
const COOP_TARGET = 450;
const COOP_TIERS = [
  {at:100, em:"🥉", title:"クラス称号 Lv.1「情報システム見習い」", desc:"全員の基礎が固まってきた証。"},
  {at:250, em:"🥈", title:"クラス称号 Lv.2「システムアドミニストレータ」", desc:"標準レベルを突破しつつある。"},
  {at:450, em:"🥇", title:"クラス称号 Lv.3「医療情報の匠」＋病院システム完成", desc:"応用まで到達。全コンポーネント点灯を目指せ！"},
];
const COMP_LIT = 24; // 各コンポーネントが「点灯」するのに必要なクラス合計正解数

/* ============================================================
   問題バンク（ワークフローで生成→独立校閲→修正。配布前にオーナー最終確認）
   各ブロック: {key,name,emoji,questions:[{level,type,q,choices,ans:[..],explain,tag}],flashcards,cloze}
   ============================================================ */

ag": "医療用語標準"}, {"level": "標準", "type": "mc", "q": "疾患登録システムや副作用報告システムなど、外部システムのデータ入力フォームを取得して提出する仕組みを標準化したIHE統合プロファイルはどれか。", "choices": ["XDS", "PIX/PDQ", "RFD", "ATNA", "CT"], "ans": [2], "explain": "RFD（Retrieve Form for Data Capture）は外部システムのデータ入力フォームの取得・提出を担う。", "tag": "IHE"}, {"level": "標準", "type": "multi", "q": "CDISC標準と役割の正しい組合せを2つ選べ。", "choices": ["SDTM — 臨床試験データの電子申請フォーマット", "CDASH — CRF（症例報告書）作成の標準", "ADaM — 研究プロトコルの計画・設計", "QRS — 統計解析用のデータセットとメタデータ", "PRM — アンケート項目・評価スケール"], "ans": [0, 1], "explain": "SDTM＝電子申請フォーマット、CDASH＝CRF作成の標準。ADaMは統計解析、QRSはアンケート・評価スケール、PRMはプロトコル計画・設計で、いずれも入れ替わっている。", "tag": "CDISC"}, {"level": "標準", "type": "mc", "q": "医療用語・分類の国際標準に関する記述で正しいのはどれか。", "choices": ["SNOMED-CTは臨床分野で用いる用語を体系的に網羅した臨床用語集である", "ICDは生活機能・健康状況を記述する概念的枠組みである", "ICFは疾病及び関連保健問題の国際統計分類である", "LOINCは監査証跡とノード認証の仕組みである", "SNOMED-CTは検査・観察項目を識別する国際コードである"], "ans": [0], "explain": "SNOMED-CTは臨床用語集。ICDは疫学・統計の国際統計分類、ICFは生活機能・健康状況の概念的枠組みで区別する。", "tag": "医療用語標準"}, {"level": "標準", "type": "mc", "q": "CDISC標準とその役割の組合せで正しいのはどれか。", "choices": ["PRM — CRF作成の標準", "ADaM — 統計解析用のデータセットとメタデータ", "CDASH — 電子申請フォーマット", "SDTM — アンケート項目・評価スケール", "QRS — 研究プロトコルの計画・設計"], "ans": [1], "explain": "ADaM（Analysis Data Model）は統計解析用のデータセットとメタデータ。他は組合せが誤り。", "tag": "CDISC"}, {"level": "標準", "type": "mc", "q": "IHE統合プロファイルとその役割の組合せで正しいのはどれか。", "choices": ["ATNA — 時刻同期", "CT — 放射線被ばく線量管理", "REM — 患者ID相互参照", "XDS — 施設間で医療文書を共有・参照", "RFD — 監査証跡とノード認証"], "ans": [3], "explain": "XDSは施設間で医療文書を共有・参照。CT＝時刻同期、REM＝線量管理、ATNA＝監査証跡・ノード認証、PIX/PDQ＝患者ID相互参照。", "tag": "IHE"}, {"level": "標準", "type": "mc", "q": "IHE統合プロファイルとその役割の組合せで誤っているのはどれか。", "choices": ["RFD — データ入力フォームの取得・提出", "XDS — 施設間で医療文書を共有・参照", "ATNA — 監査証跡とノード認証", "REM — 患者ID相互参照", "CT — 時刻同期"], "ans": [3], "explain": "REM（Radiation Exposure Monitoring）は放射線被ばく線量管理。患者ID相互参照はPIX/PDQ。", "tag": "IHE"}, {"level": "標準", "type": "mc", "q": "CDISC標準とその役割の組合せで誤っているのはどれか。", "choices": ["SDTM — 臨床試験データの電子申請フォーマット", "CDASH — CRF（症例報告書）作成の標準", "ADaM — 統計解析用のデータセットとメタデータ", "QRS — アンケート項目・評価スケール", "PRM — 検査・観察項目を識別する国際コード"], "ans": [4], "explain": "PRM（Protocol Representation Model）は研究プロトコルの計画・設計。検査・観察項目を識別する国際コードはLOINC。", "tag": "CDISC"}, {"level": "応用", "type": "mc", "q": "院外の疾患登録システムと連携する。(1) 登録システムが提供する入力フォームを電子カルテ側で呼び出して記入・提出する機能と、(2) すでに稼働している施設間の医療文書共有基盤とを区別して整備したい。このうち (1) を担うIHE統合プロファイルはどれか。", "choices": ["XDS", "RFD", "PIX/PDQ", "ATNA", "REM"], "ans": [1], "explain": "(1) 外部システムのデータ入力フォームの取得・提出はRFD。(2) 施設間の医療文書共有・参照はXDSで目的が異なる。フォーム取得・提出をXDSと取り違えないことがポイント。", "tag": "IHE"}, {"level": "応用", "type": "mc", "q": "放射線部門で被ばく線量を施設全体で収集・管理する仕組みを構築する。線量記録に正確な時刻を付与するため時刻同期の仕組み（CT: Consistent Time）も併用するが、被ばく線量そのものの収集・管理を担うIHE統合プロファイルはどれか。", "choices": ["CT", "REM", "ATNA", "XDS", "RFD"], "ans": [1], "explain": "被ばく線量の収集・管理はREM（Radiation Exposure Monitoring）。名称の紛らわしいCT（Consistent Time）は時刻同期であり、線量管理そのものは担わない。", "tag": "IHE"}, {"level": "応用", "type": "multi", "q": "CDISC標準に関する記述のうち、正しいものを2つ選べ。", "choices": ["SDTMは臨床試験データを規制当局へ電子申請するためのフォーマットである", "CDASHは症例報告書（CRF）作成の標準である", "ADaMは症例報告書（CRF）作成の標準である", "SDTMは統計解析用のデータセットとメタデータである", "CDASHは研究プロトコルの計画・設計を表現するモデルである"], "ans": [0, 1], "explain": "SDTM＝電子申請フォーマット、CDASH＝CRF作成の標準。統計解析用データセット・メタデータはADaM、プロトコル計画・設計はPRM。", "tag": "CDISC"}, {"level": "応用", "type": "mc", "q": "医療用語・分類の国際標準に関する記述のうち、正しいのはどれか。", "choices": ["疫学や統計に用いる疾病及び関連保健問題の国際統計分類はICFである", "生活機能・健康状況を記述する概念的枠組みはICDである", "検査・観察項目を識別する国際コードはLOINCである", "臨床分野で用いる用語を体系的に網羅した臨床用語集はLOINCである", "検査・観察項目を識別する国際コードはSNOMED-CTである"], "ans": [2], "explain": "LOINCは検査・観察項目を識別する国際コード。ICD＝疾病の国際統計分類（疫学・統計）、ICF＝生活機能・健康状況の概念的枠組み、SNOMED-CT＝臨床用語集。", "tag": "医療用語標準"}, {"level": "応用", "type": "mc", "q": "次の標準・プロファイルとその役割の組合せのうち、正しいのはどれか。", "choices": ["LOINC — 施設間で医療文書を共有・参照", "QRS — アンケート項目・評価スケール", "PIX/PDQ — 放射線被ばく線量管理", "ATNA — 検査・観察項目を識別する国際コード", "SNOMED-CT — 統計解析用のデータセットとメタデータ"], "ans": [1], "explain": "QRS（Questionnaires, Ratings and Scales）はアンケート項目・評価スケール。他は役割が入れ替わっている。", "tag": "CDISC"}, {"level": "応用", "type": "mc", "q": "ある病院システムで、どの利用者がいつどの患者情報にアクセスしたかの記録を確実に残し、接続するノードの正当性を認証したい。用いるべきIHE統合プロファイルはどれか。", "choices": ["CT", "ATNA", "RFD", "XDS", "PIX/PDQ"], "ans": [1], "explain": "監査証跡とノード認証はATNA（Audit Trail and Node Authentication）。", "tag": "IHE"}], "flashcards": [{"front": "RFD（IHE統合プロファイル）とは？", "back": "外部システムのデータ入力フォームの取得・提出（Retrieve Form for Data Capture）。疾患登録・副作用報告等に用いる。"}, {"front": "XDS（IHE統合プロファイル）とは？", "back": "施設間で医療文書を共有・参照（Cross-Enterprise Document Sharing）。"}, {"front": "ATNA（IHE統合プロファイル）とは？", "back": "監査証跡とノード認証（Audit Trail and Node Authentication）。"}, {"front": "REM（IHE統合プロファイル）とは？", "back": "放射線被ばく線量管理（Radiation Exposure Monitoring）。"}, {"front": "SDTMとCDASHの違いは？", "back": "SDTM＝臨床試験データの電子申請フォーマット、CDASH＝CRF（症例報告書）作成の標準。"}, {"front": "ADaM（CDISC）とは？", "back": "統計解析用のデータセットとメタデータ（Analysis Data Model）。"}, {"front": "SNOMED-CT・ICD・ICFの役割の違いは？", "back": "SNOMED-CT＝臨床用語集、ICD＝疾病及び関連保健問題の国際統計分類（疫学・統計）、ICF＝生活機能・健康状況を記述する概念的枠組み。"}, {"front": "LOINCとは？", "back": "検査・観察項目を識別する国際コード。"}], "cloze": [{"parts": ["CRF（症例報告書）作成の標準は", "、臨床試験データの電子申請フォーマットは", "、統計解析用のデータセットとメタデータは", "である。"], "blanks": ["CDASH", "SDTM", "ADaM"]}, {"parts": ["臨床分野の用語を体系的に網羅した臨床用語集は", "、疾病及び関連保健問題の国際統計分類は", "、生活機能・健康状況を記述する概念的枠組みは", "である。"], "blanks": ["SNOMED-CT", "ICD", "ICF"]}, {"parts": ["外部システムのデータ入力フォームの取得・提出は", "、施設間で医療文書を共有・参照するのは", "、放射線被ばく線量管理は", "である。"], "blanks": ["RFD", "XDS", "REM"]}], "reviewNote": "全20問についてブラインドソルブ（問題文・選択肢のみで自答→ans突合）を実施し、致命的・重大な誤りは検出されなかった。\n\n検証内容:\n- 正答照合：全20問について、issueで提示された出典（IHE 6プロファイル・CDISC 5標準・医療用語4分類の役割定義）と自己解答を突合。すべて一致（不一致0件）。\n- multi（2つ選べ）形式（qIndex 8, 16）：ans要素数（各2個）と設問文の「2つ選べ」表記が整合。ペア完全一致で判定し、いずれも他の3選択肢が明確に誤ったペア（役割の入れ替え）であることを確認、複数正解の余地なし。\n- 「誤っているのはどれか」形式（qIndex 12, 13）：残り4選択肢がすべて正しいペアであること、誤りは1つのみであることを個別に確認（qIndex12はREM―患者ID相互参照が誤り＝正しくはPIX/PDQ、qIndex13はPRM―LOINCの役割記述が誤り＝正しくはPRMはプロトコル計画設計）。選択肢設計として正解の複数化は認められない。\n- 選択肢重複・日本語の不自然さ：各設問内で選択肢テキストの重複や表現の不自然さは検出されず。\n- 出典逸脱：使用されている固有名詞（RFD, XDS, ATNA, CT, REM, PIX/PDQ, PRM, CDASH, SDTM, ADaM, QRS, SNOMED-CT, ICD, ICF, LOINC）はすべて出題ブロック内で reviewNote": "ブラインドソルブ20問全問を実施し、与えられた出典（評価軸と評価指標の対応表／改修対応フロー④ステップ／サービスデスクの役割／改修の考え方3原則）と全問のans・explainを突き合わせた。\n\n結果：致命的（S相当）・重大（A相当）の指摘は0件。全20問のans配列は出典・Q42/Q43/Q44の指定正解と完全に一致し、multi型（qIndex15）の「2つ選べ」もans要素数2件と整合、選択肢が5択で複数正解が成立してしまう設計崩れも確認されなかった。\n\n見つかったのは軽微（B/C相当）な品質上の懸念3件のみ（qIndex11: 出典内で酷似した『外来待ち時間』（業務効率）と『待ち時間』（患者満足度）の区別が解説で説明されていない／qIndex13: 難易度とlevelタグの不整合／qIndex18: qIndex4とほぼ同一設問の選択肢並べ替えのみの再掲）。\n\nその他の観察（issueとしては計上せず）：\n- qIndex0とqIndex10（サービスデスクの役割）、qIndex6とqIndex16（改修フローの最初のステップ）は同一の中核知識を異なる文脈・distractorで問う構成だが、distractor内容が十分に異なり新規の識別負荷を提供しているため重複問題としては扱わなかった。\n- 出典に列挙されている『インシデント・アクシデントの発生件数』（医療安全）と『外来診療単価』（経営指標、正答としての出題）は本セット20問中どこにも直接の正解として出題されていない（カバレッジの偏り。誤りではないが将来の拡充候補）。\n\n総じて、本ブロックは出典との整合性という点では健全であり、配布前に必須の修正を要する欠陥は検出されなかった。上記3件の軽微指摘は品質改善提案として扱われたい。", "reviewIssues": [{"qIndex": 11, "severity": "軽微", "kind": "解説不足（紛らわしい類似指標の未区別）", "detail": "正解の選択肢1「業務効率－外来待ち時間」は出典の業務効率指標『外来待ち時間』と一致し正解自体は妥当。しかし出典では患者満足度側にも酷似した『待ち時間』という指標が別途存在する（「患者満足度：満足度アンケート、待ち時間、接遇の評価」）。『外来待ち時間』と『待ち時間』という一文字違いの指標が異なる評価軸に割り当てられているにもかかわらず、explainにはこの区別への言及が一切なく、学習者が『待ち時間＝患者満足度』と早合点して誤答する土壌がある。", "fix": "explainに「患者満足度の指標である『待ち時間（体感）』とは異なり、業務効率上の『外来待ち時間（所要時間の測定）』である」旨の一文を追記し、両指標の区別を明示する。"}, {"qIndex": 13, "severity": "軽微", "kind": "難易度とlevelの不一致", "detail": "本問「次の指標のうち、『経営指標』に分類されるものはどれか」は、qIndex1（基礎）「『病床稼働率』は主にどの評価軸の指標か」と、問う方向（軸→指標／指標→軸）が逆なだけで実質的に対称な単純想起問題であり、他の『標準』問題（組合せの誤り識別、フローの順序、改修哲学の正誤判定など多段階の判断を要するもの）と比べて認知負荷が明確に軽い。", "fix": "levelを『基礎』に変更するか、経営指標3指標（病床稼働率・平均在院日数・外来診療単価）のうち複数を選択肢に含めて識別負荷を上げ『標準』相当にする。"}, {"qIndex": 18, "severity": "軽微", "kind": "出題重複（同一設問の使い回し）", "detail": "本問はqIndex4（基礎）「『診療報酬請求の査定・返戻の件数』はどの評価軸の指標か」と、設問文・選択肢の内容（医療安全／業務効率／経営指標／作業確実性／患者満足度の5択）が実質的に同一で、選択肢の並び順を変えただけの再掲になっている。『応用』レベルとして新規の識別的負荷（他の紛らわしい指標との比較等）が加わっていない。", "fix": "qIndex4と重複しない別の切り口（例：作業確実性と経営指標の境界が曖昧な複合ケース、または他の作業確実性関連指標との比較）に差し替える。"}]}, {"key": "housei", "name": "個人情報と法制度（個人情報保護法・次世代医療基盤法）", "emoji": "⚖️", "questions": [{"level": "基礎", "type": "mc", "q": "「病歴・診療情報等、取扱いに特に配慮を要する個人情報」を何というか。", "choices": ["個人関連情報", "要配慮個人情報", "仮名加工情報", "匿名加工情報", "保有個人データ"], "ans": [1], "explain": "病歴・診療情報等、取扱いに特に配慮を要する情報を要配慮個人情報という。個人関連情報はCookie等いずれの加工情報にも該当しない情報、仮名加工情報は照合しない限り識別できない加工、匿名加工情報は復元不可の加工、保有個人データは開示等の権限をもつ個人データで、いずれも定義が異なる。", "tag": "要配慮個人情報"}, {"level": "基礎", "type": "mc", "q": "「他の情報と照合しない限り個人を識別できないよう加工した情報」を何というか。", "choices": ["匿名加工情報", "個人関連情報", "仮名加工情報", "要配慮個人情報", "統計情報"], "ans": [2], "explain": "他の情報と照合しない限り個人を識別できないよう加工したものが仮名加工情報。匿名加工情報は復元不可まで加工、個人関連情報はCookie等、要配慮個人情報は病歴等、統計情報は特定個人を識別しない集計で、いずれも定義が異なる。", "tag": "仮名加工情報"}, {"level": "基礎", "type": "mc", "q": "「個人を識別できず復元もできないよう、特異記述の削除等の厳格な基準で加工した情報」を何というか。", "choices": ["仮名加工情報", "匿名加工情報", "個人関連情報", "要配慮個人情報", "保有個人データ"], "ans": [1], "explain": "個人を識別できず復元もできないよう厳格な加工基準で加工したものが匿名加工情報。仮名加工情報は照合すれば識別可能、個人関連情報はCookie等、要配慮個人情報は病歴等、保有個人データは開示等の権限をもつデータで、いずれも復元不可の加工を指さない。", "tag": "匿名加工情報"}, {"level": "基礎", "type": "mc", "q": "Cookie等、個人情報・仮名加工情報・匿名加工情報のいずれにも該当しない個人に関する情報を何というか。", "choices": ["個人関連情報", "要配慮個人情報", "統計情報", "匿名加工情報", "保有個人データ"], "ans": [0], "explain": "いずれの加工情報にも該当しない個人に関する情報（Cookie等）が個人関連情報。要配慮個人情報は病歴等、統計情報はそもそも該当せず、匿名加工情報は復元不可の加工、保有個人データは開示等の権限をもつデータで、いずれも定義が異なる。", "tag": "個人関連情報"}, {"level": "基礎", "type": "mc", "q": "開示・訂正・削除等の権限をもつ個人データを何というか。", "choices": ["個人関連情報", "仮名加工情報", "保有個人データ", "要配慮個人情報", "匿名加工情報"], "ans": [2], "explain": "開示・訂正・削除等の権限をもつ個人データを保有個人データという。個人関連情報はCookie等、仮名加工情報・匿名加工情報は加工情報、要配慮個人情報は病歴等で、いずれも開示等の権限の有無で定義される概念ではない。", "tag": "保有個人データ"}, {"level": "基礎", "type": "mc", "q": "特定の個人を識別できる情報を何というか。", "choices": ["統計情報", "個人情報", "個人関連情報", "匿名加工情報", "仮名加工情報"], "ans": [1], "explain": "特定の個人を識別できる情報が個人情報。統計情報は個人を識別しない集計、個人関連情報はCookie等、匿名加工情報は復元不可の加工、仮名加工情報は照合しない限り識別できない加工で、いずれも定義が異なる。", "tag": "個人情報"}, {"level": "基礎", "type": "mc", "q": "次世代医療基盤法で、復元できないよう加工し、NDB等の公的DBと連結解析が可能な医療情報を何というか。", "choices": ["仮名加工医療情報", "匿名加工医療情報", "個人関連情報", "統計情報", "要配慮個人情報"], "ans": [1], "explain": "復元できないよう加工しNDB等の公的DBと連結解析が可能な医療情報が匿名加工医療情報。仮名加工医療情報は連結解析不可、個人関連情報はCookie等、統計情報は集計値、要配慮個人情報は病歴等で該当しない。", "tag": "匿名加工医療情報"}, {"level": "標準", "type": "mc", "q": "「氏名・年齢・性別・病名」から氏名を削除したデータの分類として正しいものはどれか。", "choices": ["復元できないため匿名加工情報に該当する", "他の情報と照合しない限り識別できないため仮名加工情報に該当する", "統計情報に該当する", "個人関連情報に該当する", "要配慮個人情報のまま変わらない"], "ans": [1], "explain": "氏名を削除しても照合すれば識別可能なため仮名加工情報。匿名加工には法定の加工基準が必要で復元不可とはいえず、集計でないため統計情報でなく、Cookie等でないため個人関連情報でもなく、加工した時点で「要配慮個人情報のまま」でもない。", "tag": "仮名加工情報"}, {"level": "標準", "type": "mc", "q": "患者IDを削除しただけのデータについて正しいものはどれか。", "choices": ["それだけで匿名加工情報になる", "それだけでは匿名加工情報にはならない（法定の加工基準を満たす必要がある）", "直ちに個人情報ではなくなる", "統計情報になる", "個人関連情報になる"], "ans": [1], "explain": "単にID・氏名を削除しただけでは匿名加工情報にならず、法定の加工基準を満たす必要がある。よって直ちに個人情報でなくなるわけでなく、集計ではないため統計情報でも、Cookie等でないため個人関連情報でもない。", "tag": "匿名加工情報"}, {"level": "標準", "type": "mc", "q": "患者全体の「来院回数のヒストグラム」はどれに該当するか。", "choices": ["個人情報", "要配慮個人情報", "統計情報", "仮名加工情報", "個人関連情報"], "ans": [2], "explain": "来院回数のヒストグラムは特定の個人を識別しない統計情報である。個人を識別しないため個人情報・要配慮個人情報ではなく、個人単位の加工データでないため仮名加工情報でも、Cookie等でないため個人関連情報でもない。", "tag": "統計情報"}, {"level": "標準", "type": "mc", "q": "データの保存を受託している事業者と保有個人データの関係で正しいものはどれか。", "choices": ["保存受託事業者はその情報を保有個人データとして扱う", "保存受託事業者はその情報を保有個人データとして扱わないことが多い", "保存受託事業者はすべての情報を匿名加工情報として扱う", "保存受託事業者は要配慮個人情報を一切扱えない", "保存受託事業者は個人関連情報のみ扱う"], "ans": [1], "explain": "開示等の権限をもたない保存受託事業者は、その情報を保有個人データとして扱わないことが多い。委託を受けて要配慮個人情報を扱うこともあり「一切扱えない」は誤りで、加工の有無に関わらず「すべて匿名加工情報」「個人関連情報のみ」とする根拠もない。", "tag": "保有個人データ"}, {"level": "標準", "type": "mc", "q": "改正次世代医療基盤法について誤っているものはどれか。", "choices": ["匿名加工医療情報はNDB等の公的DBと連結解析ができる", "仮名加工医療情報はNDBと連結した状態で解析できる", "仮名加工医療情報は2023年改正で創設された", "仮名加工医療情報の利用は認定利用事業者に限られる", "匿名加工医療情報は研究者等へ提供できる"], "ans": [1], "explain": "誤りは「仮名加工医療情報はNDBと連結した状態で解析できる」。連結解析が認められるのは匿名加工医療情報で、仮名加工医療情報では認められない。他の4つ（匿名加工医療情報の連結解析可・研究者等への提供可、仮名加工医療情報の2023年創設・認定利用事業者限定）はいずれも正しい。", "tag": "次世代医療基盤法"}, {"level": "標準", "type": "mc", "q": "仮名加工医療情報について正しいものはどれか。", "choices": ["特異な値の削除が必須である", "特異な値の削除は不要で、医薬品承認等のためPMDA等へ提供できる", "誰でも利用できる", "NDBと連結解析ができる", "研究者等へ広く提供して利用できる"], "ans": [1], "explain": "仮名加工医療情報は特異な値の削除が不要で、医薬品承認等のためPMDA等へ提供できる。特異な値の削除は「不要」であり「必須」は誤り、利用は認定利用事業者のみで「誰でも」「研究者等へ広く提供」は誤り、NDBとの連結解析は匿名加工医療情報が対象で仮名加工では不可。", "tag": "仮名加工医療情報"}, {"level": "標準", "type": "mc", "q": "個人関連情報に関する記述として正しいものはどれか。", "choices": ["Cookie等が該当する", "統計情報が該当する", "病歴が該当する", "氏名が該当する", "診療情報が該当する"], "ans": [0], "explain": "Cookie等が個人関連情報に該当する。統計情報は個人関連情報に該当せず、病歴・診療情報は要配慮個人情報、氏名は個人情報で、いずれも個人関連情報ではない。", "tag": "個人関連情報"}, {"level": "応用", "type": "mc", "q": "匿名加工情報と仮名加工情報の違いとして正しいものはどれか。", "choices": ["匿名加工情報は復元できないよう加工され、仮名加工情報は照合しない限り識別できない加工である", "仮名加工情報は復元できないよう加工され、匿名加工情報は照合すれば識別できる", "両者とも法定の加工基準はない", "匿名加工情報のほうが加工基準が緩い", "両者は同一の概念である"], "ans": [0], "explain": "匿名加工情報は復元できないよう加工、仮名加工情報は他の情報と照合しない限り識別できないよう加工。選択肢2は両者の説明が逆、いずれも法定の加工基準があり「基準はない」は誤り、匿名加工の方が基準は厳格で「緩い」は誤り、両者は別概念で「同一」も誤り。", "tag": "匿名加工情報"}, {"level": "応用", "type": "mc", "q": "認定事業者が扱う医療情報のうち、医薬品の承認申請のためPMDAへ提供されるのは仮名加工医療情報である。一方、NDB等の公的DBと連結して大規模解析を行う場合に用いるべき情報はどれか。", "choices": ["仮名加工医療情報", "匿名加工医療情報", "要配慮個人情報", "個人関連情報", "保有個人データ"], "ans": [1], "explain": "NDB等の公的DBとの連結解析が認められるのは匿名加工医療情報。仮名加工医療情報はPMDA等への提供（医薬品承認等）に用いられ連結解析は不可、要配慮個人情報・個人関連情報・保有個人データはいずれも連結解析に用いる加工医療情報ではない。", "tag": "次世代医療基盤法"}, {"level": "応用", "type": "mc", "q": "研究者が「氏名・年齢・性別・病名」のデータから氏名だけを削除して外部の研究協力者へ渡そうとしている。このデータの分類として最も適切なものはどれか。", "choices": ["匿名加工情報なので自由に扱える", "照合すれば個人を識別できるため仮名加工情報にとどまる", "統計情報である", "個人関連情報である", "もはや個人情報ではない"], "ans": [1], "explain": "氏名を削除しても照合すれば識別できるため、匿名加工とはならず仮名加工情報にとどまる。よって「自由に扱える匿名加工情報」ではなく、集計でないため統計情報でも、Cookie等でないため個人関連情報でもなく、照合すれば識別できる以上「もはや個人情報でない」も誤り。", "tag": "仮名加工情報"}, {"level": "応用", "type": "mc", "q": "病院が「年代別の受診者数の集計表」を学会で公表する。このデータの取扱いとして正しいものはどれか。", "choices": ["要配慮個人情報として本人同意が必要", "統計情報であり特定の個人を識別しない", "仮名加工情報に該当する", "個人関連情報に該当する", "匿名加工医療情報に該当する"], "ans": [1], "explain": "年代別の受診者数の集計は特定の個人を識別しない統計情報。個人を識別しないため要配慮個人情報として本人同意を要するものではなく、個人単位の加工データでないため仮名加工情報でも、Cookie等でないため個人関連情報でも、次世代医療基盤法上の匿名加工医療情報でもない。", "tag": "統計情報"}, {"level": "応用", "type": "multi", "q": "次世代医療基盤法の「匿名加工医療情報」について正しいものを2つ選べ。", "choices": ["復元できないよう加工される", "NDB等の公的DBと連結解析ができる", "利用は認定利用事業者のみに限られる", "特異な値の削除は不要である", "2023年改正で新たに創設された"], "ans": [0, 1], "explain": "匿名加工医療情報は復元不可に加工され公的DBと連結解析が可能。認定利用事業者限定・特異値削除不要・2023年改正創設は、いずれも仮名加工医療情報の特徴であり匿名加工医療情報の説明としては誤り。", "tag": "匿名加工医療情報"}, {"level": "応用", "type": "mc", "q": "個人情報保護法上の情報分類について正しいものはどれか。", "choices": ["Cookieは要配慮個人情報である", "統計情報は個人関連情報に該当する", "病歴は要配慮個人情報である", "保有個人データは開示・訂正等の権限を問わず全ての個人データを指す", "単にIDを削除すれば匿名加工情報になる"], "ans": [2], "explain": "病歴・診療情報は要配慮個人情報。Cookieは個人関連情報で要配慮個人情報ではなく、統計情報は個人関連情報に該当せず、保有個人データは開示・訂正等の権限をもつものに限られ、ID削除だけでは匿名加工情報にならない。", "tag": "要配慮個人情報"}], "flashcards": [{"front": "個人情報とは？", "back": "特定の個人を識別できる情報。"}, {"front": "要配慮個人情報とは？", "back": "病歴・診療情報等、取扱いに特に配慮を要する情報。"}, {"front": "仮名加工情報とは？", "back": "他の情報と照合しない限り個人を識別できないよう加工した情報。"}, {"front": "匿名加工情報とは？", "back": "個人を識別できず復元もできないよう加工した情報（特異記述の削除等、加工基準が厳格）。"}, {"front": "個人関連情報とは？", "back": "個人情報・仮名/匿名加工情報のいずれにも該当しない個人に関する情報（Cookie等）。統計情報は該当しない。"}, {"front": "保有個人データとは？", "back": "開示・訂正・削除等の権限をもつ個人データ（保存受託先は該当しないことが多い）。"}, {"front": "匿名加工医療情報とNDB連結解析の可否は？", "back": "復元不可に加工され、NDB等の公的DBと連結解析が可能。研究者等へ提供できる。"}, {"front": "仮名加工医療情報（2023改正で創設）の特徴は？", "back": "特異な値の削除は不要。利用は認定利用事業者のみ。PMDA等へ提供可。NDBとの連結解析は不可。"}], "cloze": [{"parts": ["「氏名・年齢・性別・病名」から氏名を削除すると、照合しない限り識別できないため", "に該当する。単にIDを削除しただけでは", "にはならない。"], "blanks": ["仮名加工情報", "匿名加工情報"]}, {"parts": ["次世代医療基盤法で、NDB等の公的DBと連結解析ができるのは", "であり、", "では連結解析は認められない。"], "blanks": ["匿名加工医療情報", "仮名加工医療情報"]}, {"parts": ["復元できないよう厳格に加工したものが", "、照合しない限り識別できないよう加工したものが", "、いずれにも該当しないCookie等が", "である。"], "blanks": ["匿名加工情報", "仮名加工情報", "個人関連情報"]}], "reviewNote": "正答不一致（致命的）は0件。20問すべてについてブラインドソルブを実施し、提供された出典（個人情報保護法の情報分類・改正次世代医療基盤法の要約）とans/選択肢/解説を照合した結果、正解インデックスはすべて出典の記述と一致した。ただし、(1) qIndex11で出典にない固有名詞（認定仮名加工医療情報作成事業者）への依拠、(2) qIndex12で選択肢4の真偽が出典だけでは確定できず正解複数化のリスクがある点、(3) qIndex6とqIndex15がほぼ同一内容にもかかわらず基礎/応用の異なるlevelを付与されている点、(4) 来院回数ヒストグラムの重複出題（qIndex9・17）、(5) 全20問共通で誤答選択肢ごとのwhy_wrongが解説に記載されていない構造的欠落、を検出した。qIndex12は出典の範囲外の論点（仮名加工医療情報の再識別可否の主体）に触れており、実際の法令・ガイドラインに照らした追加確認（ESCALATE候補）が望ましい。", "reviewIssues": [{"qIndex": 11, "severity": "軽微", "kind": "出典逸脱（要確認・根拠未特定）", "detail": "選択肢1「認定仮名加工医療情報作成事業者はNDBと連結した状態で解析できる」で用いられている『認定仮名加工医療情報作成事業者』という固有の事業者区分名は、与えられた出典（本ブロック冒頭の要約）には一切登場しない。出典は『仮名加工医療情報…利用は認定利用事業者のみ』としか述べておらず、『作成事業者』側の権限（NDB連結可否）については出典から直接検証できない。設問の結論（連結解析不可）自体は出典の※注記から導けるが、固有名詞レベルでは出典外の知識に依拠している。", "fix": "出典に『認定仮名加工医療情報作成事業者』という用語・権限規定を明記して裏付けを加えるか、選択肢の主語を出典に記載のある一般的な表現（例：『仮名加工医療情報は』）に置き換える。"}, {"qIndex": 12, "severity": "重大", "kind": "選択肢設計の疑義（複数正解リスク・要確認）", "detail": "選択肢4『復元は法律上一切許されない』は、正解ではない前提で作問されているが、与えられた出典には仮名加工医療情報の『復元・再識別可否』について何も記述がない。実際の制度上は、認定利用事業者による再識別行為は禁止される一方、作成事業者側は対応表を保持し得るなど『一切許されない』の主語（誰にとって）が曖昧であり、出典だけでは選択肢4が確実に誤りであると立証できない。仮に選択肢4も真であれば、選択肢1と2つの正解が併存するmc問題になる（正解の複数化）。", "fix": "選択肢4の主語・条件（『認定利用事業者による再識別は』等）を明確化し、出典または一次資料（次世代医療基盤法条文・ガイドライン）に照らして選択肢4が単独で誤りと確定できることを示すか、選択肢自体を出典に基づく別の記述に差し替える。"}, {"qIndex": 15, "severity": "重大", "kind": "選択肢設計の欠陥（難易度とlevelの不一致・内容重複）", "detail": "qIndex6（level:基礎）『次世代医療基盤法で、復元できないよう加工し、NDB等の公的DBと連結解析が可能な医療情報を何というか』と、本問（level:応用）『次世代医療基盤法において、NDB等の公的DBとの連結解析が認められるのはどれか』は、問う事実・正解（匿名加工医療情報）・選択肢構成（5択中4語が完全一致、残り1語のみ入替）がほぼ同一であり、応用として求められる追加の思考操作（事例適用・複数条件の統合判断等）が存在しない。単なる定義の言い換えに『応用』のラベルを付けている点で、level区分の実質的な妥当性を欠く。", "fix": "qIndex15を、具体的な事例（データの流れ・利用主体の設定）を伴うシナリオ問題に作り替えて『応用』相当の思考負荷を持たせるか、level表記を『基礎』または『標準』に修正する。あるいはqIndex6と統合し重複出題を解消する。"}, {"qIndex": 9, "severity": "軽微", "kind": "内容重複（品質）", "detail": "qIndex9（level:標準・tag:統計情報）『患者全体の「来院回数のヒストグラム」はどれに該当するか』と、qIndex17（level:応用・tag:統計情報）『病院が「月別の来院回数のヒストグラム」を学会で公表する』は、素材（来院回数のヒストグラム）・正解概念（統計情報）が実質同一であり、問題バンクとしての多様性・弁別性が乏しい。", "fix": "どちらか一方を別の統計情報の具体例（例：疾患別罹患率グラフ、年代別受診者数）に差し替え、同一素材の反復出題を避ける。"}, {"qIndex": 0, "severity": "軽微", "kind": "解説の構造的欠落（why_wrong欠如・全問共通パターン）", "detail": "本問に限らず点検対象20問すべてのexplainが正答の理由のみを説明し、誤答選択肢それぞれについての消去理由（why_wrong）が一切記載されていない。品質基準（レビュー基準の軸5要件b＝誤答ごとの消去理由）に照らすと、全問共通で欠落している。個別に20件指摘するのではなく、パターンとして1件にまとめて報告する。", "fix": "各問の解説に、選択されなかった4選択肢それぞれについて『なぜ誤りか』を1文ずつ追記するテンプレートを適用する。同型の欠落が今後も繰り返し検出される場合はGate 1（機械チェック：explain内の誤答言及有無を検証するスクリプト）への昇格を検討する。"}]}, {"key": "security", "name": "安全管理・セキュリティ（RFP・外部保存・開示書）", "emoji": "🔐", "questions": [{"level": "基礎", "type": "mc", "q": "医療情報システムの開示書のうち「MDS」が対象とする事業者はどれか。", "choices": ["サービス事業者", "製造業者", "医療機関", "患者", "行政機関"], "ans": [1], "explain": "開示書のMDSは製造業者を対象とする自己開示書である。サービス事業者を対象とするのはSDSであり、医療機関・患者・行政機関は開示の主体でも対象でもない。", "tag": "開示書(MDS)"}, {"level": "基礎", "type": "mc", "q": "医療情報システムの開示書のうち「SDS」が対象とする事業者はどれか。", "choices": ["製造業者", "保険者", "サービス事業者", "患者", "医療機関"], "ans": [2], "explain": "開示書のSDSはサービス事業者を対象とする自己開示書である。製造業者を対象とするのはMDSであり、保険者・患者・医療機関は該当しない。", "tag": "開示書(SDS)"}, {"level": "基礎", "type": "mc", "q": "医療情報システムの調達（RFP）に記載すべきセキュリティ要件として、出典に挙げられているものはどれか。", "choices": ["情報セキュリティポリシーの整備", "患者への同意取得", "ログ管理", "診療報酬の請求", "医薬品の在庫管理"], "ans": [2], "explain": "RFPに記載すべきセキュリティ要件はログ管理・脆弱性対策・アクセス制御・フォレンジック対応。情報セキュリティポリシーは医療機関が整備する組織的事項でRFP要件ではなく、患者への同意取得・診療報酬の請求・医薬品の在庫管理はセキュリティ要件に含まれない。", "tag": "RFP"}, {"level": "基礎", "type": "mc", "q": "開示書（MDS／SDS）の記載内容は誰が開示するか。", "choices": ["医療機関", "事業者自身", "患者", "第三者認証機関", "厚生労働省"], "ans": [1], "explain": "開示書は事業者自身が自己開示するものである。医療機関・患者・第三者認証機関・厚生労働省が作成・開示するものではない。", "tag": "開示書"}, {"level": "基礎", "type": "mc", "q": "出典によれば、情報セキュリティポリシーは誰が整備する組織的事項か。", "choices": ["製造業者", "サービス事業者", "医療機関", "患者", "監査法人"], "ans": [2], "explain": "情報セキュリティポリシーは医療機関が整備する組織的事項である。製造業者・サービス事業者・患者・監査法人が整備するものではない。", "tag": "情報セキュリティポリシー"}, {"level": "基礎", "type": "mc", "q": "医療情報の外部保存を委託する際に確認が必要なこととして、出典に挙げられているものはどれか。", "choices": ["患者本人からの個別同意", "外部保存する情報機器が国内法の適用を受けること", "事業者の株式公開状況", "診療科ごとの受診者数", "医師の専門医資格"], "ans": [1], "explain": "外部保存では情報機器が国内法の適用を受けることの確認が必要。患者本人からの個別同意は必ずしも必要なく、事業者の株式公開状況・診療科ごとの受診者数・医師の専門医資格は確認事項ではない。", "tag": "外部保存"}, {"level": "基礎", "type": "mc", "q": "開示書（MDS／SDS）は、医療機関にとってどのように利用できるか。", "choices": ["患者への同意書として利用できる", "事業者に説明を求める際のベースとして利用できる", "診療報酬請求の根拠として利用できる", "医薬品の添付文書として利用できる", "医師国家試験の出題根拠として利用できる"], "ans": [1], "explain": "開示書は医療機関が事業者に説明を求める際のベースとして利用できる。患者への同意書・診療報酬請求の根拠・医薬品の添付文書・国家試験の出題根拠として用いるものではない。", "tag": "開示書"}, {"level": "標準", "type": "mc", "q": "医療情報システムの調達（RFP）に記載すべきセキュリティ要件として、適切でないものはどれか。", "choices": ["ログ管理", "脆弱性対策", "情報セキュリティポリシー", "アクセス制御", "フォレンジック対応"], "ans": [2], "explain": "情報セキュリティポリシーは医療機関が整備する組織的事項であり、RFPのセキュリティ要件ではない。ログ管理・脆弱性対策・アクセス制御・フォレンジック対応はいずれもRFPに記載すべき要件である。", "tag": "RFP"}, {"level": "標準", "type": "mc", "q": "医療情報の外部保存を委託する際に、必ずしも行う必要がないものはどれか。", "choices": ["外部保存する情報機器が国内法の適用を受けることを確認する", "守秘義務と違反時のペナルティを契約で定める", "患者に対して安全性やリスクを含めて個別に説明し同意を得る", "保守に不要な情報を委託先に閲覧させない", "委託先のセキュリティ対策状況を確認する"], "ans": [2], "explain": "外部保存の委託にあたり患者への個別の説明・同意は必ずしも必要ない。国内法適用の確認・守秘義務とペナルティの契約・保守に不要な情報を閲覧させないこと・委託先のセキュリティ対策状況の確認は、いずれも必要な事項である。", "tag": "外部保存"}, {"level": "標準", "type": "mc", "q": "開示書（MDS／SDS）に関する記述として、誤っているものはどれか。", "choices": ["安全管理ガイドラインの要求事項に沿った構成である", "事業者が自己開示するものである", "セキュリティ機能の自己評価手段である", "「提供事業者における安全管理ガイドライン」への適合性が示されている", "医療機関が説明を求める際のベースとして利用できる"], "ans": [3], "explain": "開示書は「提供事業者における安全管理ガイドライン」への適合性を示すものではない（これが誤り）。要求事項に沿った構成であること・事業者の自己開示であること・自己評価手段であること・説明を求めるベースになることは、いずれも正しい。", "tag": "開示書"}, {"level": "標準", "type": "mc", "q": "調達（RFP）に記載すべきセキュリティ要件の組合せとして、出典に沿って正しいものはどれか。", "choices": ["ログ管理・情報セキュリティポリシー・アクセス制御・患者同意", "ログ管理・脆弱性対策・アクセス制御・フォレンジック対応", "情報セキュリティポリシー・脆弱性対策・患者同意・守秘義務", "アクセス制御・診療報酬請求・ログ管理・在庫管理", "フォレンジック対応・情報セキュリティポリシー・患者同意・国内法確認"], "ans": [1], "explain": "RFPのセキュリティ要件はログ管理・脆弱性対策・アクセス制御・フォレンジック対応。情報セキュリティポリシー・患者同意・診療報酬請求・在庫管理・守秘義務・国内法確認を含む他の組合せは、RFPのセキュリティ要件として不適切な項目を含む。", "tag": "RFP"}, {"level": "標準", "type": "mc", "q": "医療情報の外部保存の委託について、出典に沿って正しい記述はどれか。", "choices": ["患者全員から個別に同意を得ることが必須である", "守秘義務と違反時のペナルティを契約で定める", "保守のためすべての情報を委託先に閲覧させる", "委託先のセキュリティ対策状況は確認しなくてよい", "情報機器が国外法のみの適用を受けることを確認する"], "ans": [1], "explain": "外部保存の委託では守秘義務と違反時のペナルティを契約で定める。患者全員からの個別同意は必須でなく、保守に不要な情報まで閲覧させるのは不可、委託先のセキュリティ対策状況は確認が必要で、情報機器は国内法の適用を受けることを確認する。", "tag": "外部保存"}, {"level": "標準", "type": "mc", "q": "開示書のMDSとSDSの対象の組合せとして正しいものはどれか。", "choices": ["MDS＝サービス事業者、SDS＝製造業者", "MDS＝製造業者、SDS＝サービス事業者", "MDS＝医療機関、SDS＝患者", "MDS＝患者、SDS＝医療機関", "MDS＝製造業者、SDS＝製造業者"], "ans": [1], "explain": "MDSは製造業者、SDSはサービス事業者の自己開示書。両者を入れ替えた組合せや、医療機関・患者を対象とする組合せ、両方を製造業者とする組合せはいずれも誤り。", "tag": "開示書"}, {"level": "標準", "type": "mc", "q": "情報セキュリティポリシーに関する出典の記述として正しいものはどれか。", "choices": ["製造業者がRFPに記載すべきセキュリティ要件である", "医療機関が整備する組織的事項であり、RFPのセキュリティ要件には含めない", "開示書（MDS／SDS）で適合性が示される事項である", "外部保存の委託で患者に説明すべき事項である", "フォレンジック対応の一部として自動的に整備される"], "ans": [1], "explain": "情報セキュリティポリシーは医療機関が整備する組織的事項で、RFPのセキュリティ要件には含めない。製造業者がRFPに記載する要件でも、開示書で適合性が示される事項でも、外部保存で患者に説明する事項でも、フォレンジック対応で自動整備されるものでもない。", "tag": "情報セキュリティポリシー"}, {"level": "応用", "type": "mc", "q": "医療機関がクラウド型サービスの調達にあたり、サービス事業者にSDSの提示を求めた。SDSの位置づけとして最も適切なものはどれか。", "choices": ["第三者認証によりサービスの安全性を保証するので、医療機関側での確認は不要になる", "事業者が自己開示するもので説明を求めるベースになるが、提供事業者における安全管理ガイドラインへの適合性を証明するものではない", "製造業者が自己開示するものであり、サービス事業者には適用されない", "患者への安全性の説明・同意取得の代替として利用できる", "RFPのセキュリティ要件そのものであり、ログ管理や脆弱性対策の記載を省略できる"], "ans": [1], "explain": "SDSはサービス事業者による自己開示書で、医療機関が説明を求めるベースになる。ただし第三者認証ではなく（選択肢0は誤り）、対象はサービス事業者でありMDSと混同しない（選択肢2は誤り）、患者同意の代替でもRFP要件そのものでもない（選択肢3・4は誤り）。さらに「提供事業者における安全管理ガイドライン」への適合性を証明するものではない点に注意する。", "tag": "開示書(SDS)"}, {"level": "応用", "type": "multi", "q": "医療情報システムの調達（RFP）に記載すべきセキュリティ要件として、出典に挙げられているものを2つ選べ。", "choices": ["情報セキュリティポリシーの整備", "アクセス制御", "患者への個別同意の取得", "フォレンジック対応", "診療報酬の請求管理"], "ans": [1, 3], "explain": "RFPのセキュリティ要件はログ管理・脆弱性対策・アクセス制御・フォレンジック対応。選択肢中はアクセス制御とフォレンジック対応が該当する。情報セキュリティポリシーは医療機関が整備する組織的事項、患者への個別同意・診療報酬の請求管理はセキュリティ要件に含まれない。", "tag": "RFP"}, {"level": "応用", "type": "multi", "q": "ある病院が診療データの外部保存を事業者に委託する。委託で「必ず行う必要がある」ものを2つ選べ。", "choices": ["患者全員から書面で個別同意を得る", "委託先のセキュリティ対策状況を確認する", "守秘義務と違反時のペナルティを契約で定める", "保守に不要な情報も含め全データを委託先に常時閲覧させる", "情報機器を必ず国外に設置する"], "ans": [1, 2], "explain": "外部保存の委託では委託先のセキュリティ対策状況の確認と、守秘義務・違反時のペナルティの契約が必要。患者全員からの書面個別同意は必須でなく、保守に不要な情報まで常時閲覧させるのは不可、情報機器の国外設置は要件ではない（むしろ国内法の適用を受けることを確認する）。", "tag": "外部保存"}, {"level": "応用", "type": "mc", "q": "事業者が「当社の開示書は提供事業者における安全管理ガイドラインへの適合性を証明している」と説明した。この説明の評価として正しいものはどれか。", "choices": ["正しい。開示書は当該ガイドラインへの適合性の証明である", "誤り。開示書は当該ガイドラインへの適合性を示すものではない", "正しい。開示書は第三者認証による適合性証明である", "誤り。開示書は患者の同意書である", "正しい。開示書は医療機関が作成する適合性証明である"], "ans": [1], "explain": "開示書は事業者の自己開示であり、提供事業者における安全管理ガイドラインへの適合性を示すものではないため、この説明は誤り。第三者認証による証明でも、患者の同意書でも、医療機関が作成する適合性証明でもない。", "tag": "開示書"}, {"level": "応用", "type": "mc", "q": "情報システム担当者がRFPのセキュリティ要件欄に「情報セキュリティポリシーの整備」を記載しようとしている。出典に照らした対応として最も適切なものはどれか。", "choices": ["そのままRFPのセキュリティ要件として記載する", "情報セキュリティポリシーは医療機関が整備する組織的事項なので、RFP要件からは外す", "製造業者に情報セキュリティポリシーの作成を義務づける", "患者同意とセットでRFPに記載する", "フォレンジック対応の代わりに記載する"], "ans": [1], "explain": "情報セキュリティポリシーは医療機関が整備する組織的事項であり、RFPのセキュリティ要件から外す。そのまま記載する・製造業者に作成を義務づける・患者同意とセットで記載する・フォレンジック対応の代わりに記載する対応はいずれも不適切。", "tag": "RFP"}, {"level": "応用", "type": "mc", "q": "医療情報システムの安全管理に関する次の記述のうち、出典に照らして正しいものはどれか。", "choices": ["外部保存の委託では患者への個別同意が必須である", "開示書は事業者の自己評価手段であり、標準的な記載方法をもつ", "RFPには情報セキュリティポリシーを必ず含める", "MDSはサービス事業者の自己開示書である", "開示書は第三者機関が事業者に代わって作成する"], "ans": [1], "explain": "開示書はセキュリティ機能の自己評価手段・標準的記載方法であり、事業者が自己開示する。外部保存の委託で患者個別同意は必須でなく、RFPに情報セキュリティポリシーは含めず、MDSは製造業者（サービス事業者ではない）の開示書で、開示書は第三者機関ではなく事業者自身が作成する。", "tag": "開示書"}], "flashcards": [{"front": "調達（RFP）に記載すべきセキュリティ要件（4つ）は？", "back": "ログ管理／脆弱性対策／アクセス制御／フォレンジック対応"}, {"front": "RFPのセキュリティ要件に含めないもの（医療機関が整備する組織的事項）は？", "back": "情報セキュリティポリシー"}, {"front": "開示書の「MDS」が対象とする事業者は？", "back": "製造業者"}, {"front": "開示書の「SDS」が対象とする事業者は？", "back": "サービス事業者"}, {"front": "外部保存の委託で必ずしも必要ないことは？", "back": "患者への個別の説明・同意"}, {"front": "外部保存を委託する情報機器について確認すべきことは？", "back": "国内法の適用を受けること"}, {"front": "開示書（MDS／SDS）は誰が開示し、どう位置づけられる？", "back": "事業者が自己開示。セキュリティ機能の自己評価手段・標準的記載方法で、医療機関が説明を求めるベースになる"}, {"front": "開示書（MDS／SDS）が「示すものではない」ものは？", "back": "「提供事業者における安全管理ガイドライン」への適合性"}], "cloze": [{"parts": ["開示書のうち、MDSは", "が、SDSは", "が自己開示する。"], "blanks": ["製造業者", "サービス事業者"]}, {"parts": ["調達（RFP）に記載すべきセキュリティ要件はログ管理・脆弱性対策・", "・フォレンジック対応であり、", "はRFPのセキュリティ要件に含めない。"], "blanks": ["アクセス制御", "情報セキュリティポリシー"]}, {"parts": ["外部保存の委託では、情報機器が", "の適 /* ============================================================
   ストレージ層（GASがあればGAS、無ければlocalStorage）— GAS v3同時書き込み設計
   ============================================================ */
const LS = {
  get(k,d){ try{const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{localStorage.setItem(k, JSON.stringify(v));}catch(e){} }
};
const HAS_GAS = !!(GAS_URL && GAS_URL.indexOf("http")===0);
async function gasPost(payload, opt){
  opt = opt || {};
  const retries = (opt.retries!=null) ? opt.retries : 4;   // 書き込みは既定4回リトライ
  const timeout = opt.timeout || 15000;                    // 15秒で必ず打ち切り（無限フリーズ防止）
  for(let a=0; a<=retries; a++){
    try{
      const ctrl = new AbortController();
      const tm = setTimeout(()=>ctrl.abort(), timeout);
      const r = await fetch(GAS_URL, {method:"POST", body:JSON.stringify(payload), signal:ctrl.signal});
      clearTimeout(tm);
      const j = await r.json();
      if(j && j.status==="busy" && a < retries){ await new Promise(res=>setTimeout(res, 600*(a+1) + Math.random()*700)); continue; }
      return j;
    }catch(e){
      if(a < retries){ await new Promise(res=>setTimeout(res, 600*(a+1) + Math.random()*700)); continue; }
      return {status:"error"};
    }
  }
  return {status:"error"};
}
const Store = {
  async saveResult(r){
    if(HAS_GAS){ await gasPost({type:"save", result:r}); }
    else{ const a=LS.get("results",[]); a.push(r); LS.set("results",a); }
  },
  async addTeam(team, points, block, correct){
    if(HAS_GAS){ await gasPost({type:"team_add", team, points, block, correct}); }
    else{
      const t=LS.get("teamPts",{}); t[team]=(t[team]||0)+points; LS.set("teamPts",t);
      const c=LS.get("compTot",{}); c[block]=(c[block]||0)+correct; LS.set("compTot",c);
    }
  },
  async addCoop(correct, block){
    if(HAS_GAS){ await gasPost({type:"coop_add", correct, block}); }
    else{
      LS.set("coopTot",(LS.get("coopTot",0))+correct);
      const c=LS.get("compTot",{}); c[block]=(c[block]||0)+correct; LS.set("compTot",c);
    }
  },
  async loadResults(){ if(HAS_GAS){ const r=await gasPost({type:"load"}); return (r&&r.status==="ok")?r.students||[]:[]; } return LS.get("results",[]); },
  // teams(points)+components(correct)+coop total を1回で取得（スクリーン/協力/ダッシュボード共通）
  async loadState(){
    if(HAS_GAS){ const r=await gasPost({type:"state"},{retries:1,timeout:8000});
      return (r&&r.status==="ok") ? {teams:r.teams||{}, comps:r.comps||{}, total:r.total||0} : null; }
    return {teams:LS.get("teamPts",{}), comps:LS.get("compTot",{}), total:LS.get("coopTot",0)};
  },
  async clearAll(){ if(HAS_GAS){ await gasPost({type:"clear"}); }
    ["results","teamPts","compTot","coopTot"].forEach(k=>localStorage.removeItem(k)); }
};

let F={};
function startFlash(bk){ const b=QBANK.find(x=>x.key===bk); F={ cards:shuffle((b.flashcards||[]).slice()), i:0, flip:false, again:[], bk, name:b.name }; drawFlash(); }
function drawFlash(){

    if(F.again.length){ F.cards=shuffle(F.again); F.again=[]; F.i=0; }
    else{ setScreen(`<div class="hd"><div class="t">✅ ${esc(F.name)} 完了</div></div><div class="card" style="text-align:center"><p style="font-size:40px;margin:6px">🎉</p><p>全部「言えた」！ この勢いでクイズへ。</p></div><button class="btn" onclick="go('quiz')">⏱️ クイズで試す</button><button class="btn ghost" onclick="go('memo')">暗記メニューへ</button>`); return; }
  }

  setScreen(`
    <div class="hd"><div class="t">🃏 ${esc(F.name)}</div><span class="pill">${F.i+1} / ${F.cards.length}</span></div>
    <div class="card flash" onclick="flipCard()">
      ${F.flip?`<div>${esc(c.back)}<small>▲ タップで問いに戻る</small></div>`:`<div>${esc(c.front)}<small>▼ タップで答えを見る</small></div>`}

function flipCard(){ F.flip=!F.flip; drawFlash(); }
function markCard(ok){ if(!ok) F.again.push(F.cards[F.i]); F.i++; F.flip=false; drawFlash(); }

let C={};
function startCloze(bk){ const b=QBANK.find(x=>x.key===bk); C={list:shuffle((b.cloze||[]).slice()),i:0,name:b.name}; drawCloze(); }
function drawCloze(){
  if(C.i>=C.list.length){ setScreen(`<div class="hd"><div class="t">✅ ${esc(C.name)} 穴埋め完了</div></div><div class="card" style="text-align:center"><p style="font-size:40px">🧠</p><p>流れごと言えるように！</p></div><button class="btn" onclick="go('quiz')">⏱️ クイズで試す</button><button class="btn ghost" onclick="go('memo')">暗記メニューへ</button>`); return; }
  const it=C.list[C.i]; C.filled=[]; C.bank=shuffle(it.blanks.slice()); paintCloze();
}
function paintCloze(){
  const it=C.list[C.i]; let sent="";
  it.parts.forEach((p,idx)=>{ sent+=esc(p); if(idx<it.blanks.length){ const v=C.filled[idx];
    sent+=`<span class="blank" onclick="unfill(${idx})">${v?esc(v):"　？　"}</span>`; }});
  const done=C.filled.filter(Boolean).length===it.blanks.length;
  setScreen(`
    <div class="hd"><div class="t">✍️ ${esc(C.name)}</div><span class="pill">${C.i+1} / ${C.list.length}</span></div>
    <div class="card" style="font-size:17px;line-height:2.1">${sent}</div>
    <div class="card"><div class="muted" style="font-size:12px;margin-bottom:6px">下の語を空欄に順番にタップ</div>
      ${C.bank.map((w)=>`<span class="chip ${C.filled.includes(w)?'used':''}" onclick="fill('${esc(w)}')">${esc(w)}</span>`).join("")}
    </div>
    ${done?`<button class="btn" onclick="checkCloze()">こたえ合わせ</button>`:``}
    <button class="btn ghost sm" onclick="go('memo')">やめる</button>
  `);
}
function fill(w){ const it=C.list[C.i]; const idx=C.filled.length; if(idx<it.blanks.length){ C.filled[idx]=w; paintCloze(); } }
function unfill(idx){ if(C.filled[idx]!==undefined){ C.filled.splice(idx,1); paintCloze(); } }
function checkCloze(){
  const it=C.list[C.i]; const ok=it.blanks.every((b,i)=>C.filled[i]===b);
  let sent="";
  it.parts.forEach((p,idx)=>{ sent+=esc(p); if(idx<it.blanks.length){ const right=it.blanks[idx], got=C.filled[idx];
    sent+=`<span class="blank" style="color:${got===right?'var(--ok)':'var(--ng)'};border-color:${got===right?'var(--ok)':'var(--ng)'}">${esc(right)}</span>`; }});
  setScreen(`
    <div class="hd"><div class="t">${ok?'⭕ 正解！':'もう一度'}</div></div>
    <div class="card" style="font-size:17px;line-height:2.1">${sent}</div>
    <button class="btn" onclick="C.i++;drawCloze()">次へ ▶</button>
    ${ok?'':'<button class="btn ghost" onclick="drawCloze()">この問題をやり直す</button>'}
  `);
}

/* ============================================================
   クイズエンジン（個人 / チーム戦 / 協力 共有）  mode: solo|team|coop
   ============================================================ */
let Q={};
function shuffleChoices(q){
  const order=shuffle(q.choices.map((_,i)=>i));
  const choices=order.map(i=>q.choices[i]);
  const ans = (q.ans||[]).map(a=>order.indexOf(a)).filter(i=>i>=0);
  return Object.assign({},q,{choices,ans});
}
const QN = {solo:10, team:8, coop:8};
function startQuiz(mode, block, level){
  const pool0 = byBL(block, level);
  if(!pool0.length){ alert("この範囲の問題がまだありません"); return; }
  const n = Math.min(QN[mode]||10, pool0.length);
  const pool = shuffle(pool0).slice(0,n).map(shuffleChoices);
  Q={ mode, block, level, qs:pool, i:0, correct:0, score:0, streak:0, maxStreak:0, answers:[], sel:[], locked:false };
  nextQuiz();
}
function nextQuiz(){
  if(Q.i>=Q.qs.length){ endQuiz(); return; }
  Q.sel=[]; Q.locked=false; Q.timeLeft=TIME_LIMIT; Q.started=Date.now();
  paintQuiz();
  if(Q.timer) clearInterval(Q.timer);
  Q.timer=setInterval(()=>{
    Q.timeLeft--; const bar=$("tbar"); if(bar) bar.style.width=Math.max(0,Q.timeLeft/TIME_LIMIT*100)+"%";
    if(Q.timeLeft<=0){ clearInterval(Q.timer); if(!Q.locked) lockAnswer(true); }
  },1000);
}
function calcBonus(){
  const third=Math.floor(TIME_LIMIT/3);
  const speed = Q.timeLeft>=(third*2)?30 : Q.timeLeft>=third?20 : 10;
  const streakB = Math.min(Q.streak-1,5)*2;
  const mult = LVL_MULT[Q.qs[Q.i].level]||1;
  return Math.round((speed+streakB)*mult);
}
function paintQuiz(){
  const q=Q.qs[Q.i]; const multi=q.type==="multi";
  const label={solo:"⏱️ 個人クイズ",team:"⚔️ チーム戦",coop:"🤝 協力"}[Q.mode];
  setScreen(`
    <div class="hd"><div class="t">${label}</div><span class="pill">${lvlPill(q.level)} ${Q.i+1}/${Q.qs.length}</span></div>
    <div class="timerbar"><i id="tbar"></i></div>
    <div class="card"><h3 style="font-size:17px;line-height:1.55">${esc(q.q)}</h3>
      ${multi?'<p class="muted" style="font-size:12px;margin:6px 0 0">▼ あてはまるものを全部えらぶ → 決定</p>':''}</div>
    <div id="choices">
      ${q.choices.map((c,idx)=>`<button class="choice" data-i="${idx}" onclick="pick(${idx})">${multi?'<span class="cbx"></span>':''}${esc(c)}</button>`).join("")}
    </div>
    ${multi?'<button class="btn" onclick="lockAnswer(false)">決定</button>':''}
  `);
  requestAnimationFrame(()=>{ const b=$("tbar"); if(b){ b.style.transition="none"; b.style.width="100%"; requestAnimationFrame(()=>{ b.style.transition="width 1s linear"; }); }});
}
function pick(idx){
  const q=Q.qs[Q.i]; if(Q.locked) return;
  if(q.type==="multi"){
    const p=Q.sel.indexOf(idx); if(p>=0) Q.sel.splice(p,1); else Q.sel.push(idx);
    document.querySelectorAll("#choices .choice").forEach(el=>{ const i=+el.dataset.i; el.classList.toggle("sel", Q.sel.includes(i)); });
  }else{ Q.sel=[idx]; lockAnswer(false); }
}
function lockAnswer(timeout){
  if(Q.locked) return; Q.locked=true; if(Q.timer) clearInterval(Q.timer);
  const q=Q.qs[Q.i];
  const ansArr = (q.ans||[]).slice();
  const ok = !timeout && Q.sel.length===ansArr.length && Q.sel.every(i=>ansArr.includes(i));
  document.querySelectorAll("#choices .choice").forEach(el=>{ const i=+el.dataset.i;
    el.classList.remove("correct","wrong","sel");
    if(ansArr.includes(i)) el.classList.add("correct");
    else if(Q.sel.includes(i)) el.classList.add("wrong");
    else el.classList.add("dim");
    el.setAttribute("onclick","");
  });
  let gained=0;
  if(ok){ Q.correct++; Q.streak++; Q.maxStreak=Math.max(Q.maxStreak,Q.streak); gained=calcBonus(); Q.score+=gained; }
  else{ Q.streak=0; }
  Q.answers.push({id:q.id, block:q.block, level:q.level, ok});
  const fb=document.createElement("div"); fb.className="fbcard";
  fb.style.borderColor = ok?"var(--ok)":"var(--ng)";
  fb.innerHTML = (ok?`<b style="color:var(--ok);font-size:18px">⭕ 正解！ +${gained}点</b>${Q.streak>1?` <span class="pill">${Q.streak}連続🔥</span>`:''}`
    : `<b style="color:var(--ng);font-size:18px">${timeout?'⏰ 時間切れ':'✗ ざんねん'}</b>`)
    + `<p class="muted" style="font-size:13px;margin:8px 0 0;text-align:left">💡 ${esc(q.explain||"")}</p>`;
  $("screen").appendChild(fb);
  fb.scrollIntoView({behavior:"smooth", block:"end"});
  setTimeout(()=>{ Q.i++; nextQuiz(); }, ok?1100:1700);
}
async function endQuiz(){
  if(Q.timer) clearInterval(Q.timer);
  const pct=Math.round(Q.correct/Q.qs.length*100);
  const rec={ name:S.user, team:S.team, block:Q.block, blockName:(Q.block==="総合"?"総合":BLOCK_NAME[Q.block]||Q.block),
    level:Q.level, mode:Q.mode, score:Q.score, correct:Q.correct, total:Q.qs.length, pct,
    maxStreak:Q.maxStreak, time:Date.now(), answers:Q.answers };
  Store.saveResult(rec);            // 書き込みは待たない（内部で自動リトライ）＝フリーズしない
  updateMyRecords(rec);

  if(Q.mode==="team"){
    Store.addTeam(S.team, Q.score, Q.block==="総合"?null:Q.block, Q.correct);
    setScreen(`
      <div class="hd"><div class="t">⚔️ チームに加点！</div><span class="pill">チーム${S.team}</span></div>
      <div class="fbcard" style="border-color:var(--gold)"><p style="font-size:34px;margin:2px">＋${Q.score}点</p>
        <p>正解 <b>${Q.correct}/${Q.qs.length}</b>（${esc(Q.level)}）がチーム${S.team}の得点になりました。</p>
        <p class="muted" style="font-size:13px">前のスクリーンでチーム順位とコンポーネント点灯を見よう！</p></div>
      <div id="tstand"></div>
      <button class="btn" onclick="go('team')">もう1ラウンド</button>
      <button class="btn ghost" onclick="go('home')">ホームへ</button>`);
    setTimeout(async()=>{ const d=await Store.loadState(); const el=$("tstand"); if(d&&el) el.innerHTML=teamStandHtml(d.teams,S.team); },1500);
    return;
  }
  if(Q.mode==="coop"){
    Store.addCoop(Q.correct, Q.block==="総合"?null:Q.block);
    coopKnown += Q.correct;
    setScreen(`
      <div class="hd"><div class="t">🤝 クラスに貢献！</div></div>
      <div class="fbcard" style="border-color:var(--ok)"><p style="font-size:34px;margin:2px">＋${Q.correct}</p>
        <p>あなたの正解がクラス合計に加わりました。</p></div>
      <div id="coopGauge">${gaugeHtml(coopKnown)}</div>
      <button class="btn" onclick="go('coop')">もう1ラウンド</button>
      <button class="btn ghost" onclick="go('home')">ホームへ</button>`);
    setTimeout(async ()=>{ const d=await Store.loadState(); if(d){ coopKnown=Math.max(coopKnown,d.total); const g=$("coopGauge"); if(g) g.innerHTML=gaugeHtml(coopKnown); } }, 2000);
    return;
  }
  // solo: 自己ベスト・成長（個人の対他人順位は出さない）
  const key="best_"+Q.block+"_"+Q.level;
  const prev=LS.get(key,null);
  let growth="";
  if(prev==null){ growth=`<div class="grow same">はじめての記録！ 次はこれを超えよう</div>`; }
  else if(Q.correct>prev.correct){ growth=`<div class="grow up">⬆ 前回より +${Q.correct-prev.correct}問！ 伸びてる</div>`; }
  else if(Q.correct===prev.correct){ growth=`<div class="grow same">前回と同じ（${Q.correct}問）。あと1問！</div>`; }
  else { growth=`<div class="grow same">今回 ${Q.correct}問（自己ベスト ${prev.correct}問）。もう一回いこう</div>`; }
  if(prev==null || Q.correct>prev.correct || (Q.correct===prev.correct && Q.score>(prev.score||0))) LS.set(key,{correct:Q.correct,score:Q.score,total:Q.qs.length});
  setScreen(`
    <div class="hd"><div class="t">結果</div><span class="pill">${(Q.block==="総合"?"総合":esc(BLOCK_NAME[Q.block]||Q.block))} ${lvlPill(Q.level)}</span></div>
    <div class="kpi">
      <div class="k"><b>${Q.correct}/${Q.qs.length}</b><span>正解</span></div>
      <div class="k"><b>${pct}%</b><span>正答率</span></div>
      <div class="k"><b>${Q.score}</b><span>スコア</span></div>
      <div class="k"><b>${Q.maxStreak}</b><span>最大連続</span></div>
    </div>
    <div class="card" style="text-align:center">${growth}
      <p class="muted" style="font-size:12px;margin-top:8px">※ 学生画面に個人順位は出していません。競うのは「昨日の自分」とチームです。</p></div>
    <button class="btn" onclick="startQuiz('solo','${Q.block}','${Q.level}')">もう一度（自己ベスト更新）</button>
    <button class="btn ghost" onclick="go('quiz')">別の範囲・難易度へ</button>
    <button class="btn ghost sm" onclick="go('me')">🏅 マイ記録を見る</button>
  `);
}

/* ---------- マイ記録・バッジ（個人だが対他人比較なし） ---------- */
function updateMyRecords(rec){
  const m=LS.get("myAgg",{plays:0,correct:0,total:0,bestStreak:0,byLvl:{},cleared:{}});
  m.plays++; m.correct+=rec.correct; m.total+=rec.total; m.bestStreak=Math.max(m.bestStreak,rec.maxStreak||0);
  m.byLvl[rec.level]=(m.byLvl[rec.level]||0)+rec.correct;
  // クリアバッジ：各ブロック×難易度で正答率80%以上を達成したら点灯
  if(rec.block!=="総合" && rec.level!=="総合" && rec.pct>=80){ m.cleared[rec.block+"_"+rec.level]=true; }
  LS.set("myAgg",m);
}
function myTitle(correct){
  if(correct>=200) return {em:"👑",t:"医療情報マスター"};
  if(correct>=120) return {em:"🎖️",t:"上級システムアナリスト"};
  if(correct>=60)  return {em:"🥈",t:"システムアドミニストレータ"};
  if(correct>=20)  return {em:"🥉",t:"情報システム見習い"};
  return {em:"🌱",t:"ルーキー"};
}

function authT(){ if($("pw").value===ADMIN_PW){ T.auth=true; paintTeacher(); } else alert("パスワードが違います"); }
async function paintTeacher(){
  const results=await Store.loadResults();
  const st=await Store.loadState();
  const teams = st ? st.teams : {};
  const coop  = st ? st.total : 0;
  const tabs=[["teams","概況/チーム"],["rank","個人ランキング"],["items","問題別正答率"],["students","個人履歴"]];
  let body="";
  if(T.tab==="teams"){
    const players=new Set(results.map(r=>r.name)).size;
    const arr=[]; for(let i=1;i<=TEAM_COUNT;i++) arr.push({t:i,v:Math.round(teams[i]||0)});
    arr.sort((a,b)=>b.v-a.v); const max=Math.max(1,...arr.map(x=>x.v));
    body=`<div class="kpi"><div class="k"><b>${players}</b><span>参加人数</span></div>
      <div class="k"><b>${results.length}</b><span>プレイ回数</span></div>
      <div class="k"><b>${coop}</b><span>協力合計</span></div></div>
      <div class="card"><h3>チーム得点（スコア）</h3>${arr.map((x,idx)=>`<div class="teambar"><div class="rk">${idx+1}</div><div class="lab">チーム${x.t}</div><div class="bwrap"><i style="width:${Math.round(x.v/max*100)}%;background:var(--blue)"></i></div><div class="val">${x.v}</div></div>`).join("")}</div>
      <p class="muted" style="font-size:12px">スクリーン投影は <b>?screen=1</b> を付けたURLを別タブで開く</p>`;
  }
  else if(T.tab==="rank"){
    body=teacherRank(results);
  }
  else if(T.tab==="items"){
    const stat={};
    results.forEach(r=>(r.answers||[]).forEach(a=>{ stat[a.id]=stat[a.id]||{ok:0,n:0}; stat[a.id].n++; if(a.ok)stat[a.id].ok++; }));
    const rows=QUESTIONS.map(q=>{ const s=stat[q.id]||{ok:0,n:0}; const p=s.n?Math.round(s.ok/s.n*100):null; return {q,p,n:s.n}; })
      .filter(r=>r.n>0).sort((a,b)=>a.p-b.p);
    body=`<div class="banner">正答率が低い順（デブリーフはこのTOPから）</div>
      <table class="dash"><tr><th>問題</th><th class="n">正答率</th><th class="n">n</th></tr>
      ${rows.length?rows.map((r,idx)=>`<tr><td>${idx<5?'🔴 ':''}${lvlPill(r.q.level)} <b>${esc((BLOCK_NAME[r.q.block]||'').replace(/（.*/,''))}</b> ${esc(r.q.q.slice(0,24))}…</td>
        <td class="n">${r.p}%<div class="barmini"><i style="width:${r.p}%"></i></div></td><td class="n">${r.n}</td></tr>`).join("")
        :`<tr><td colspan="3" class="muted">まだ回答がありません</td></tr>`}</table>`;
  }
  else{
    const agg={};
    results.forEach(r=>{ agg[r.name]=agg[r.name]||{name:r.name,team:r.team,plays:0,correct:0,total:0,best:0,streak:0}; const a=agg[r.name];
      a.plays++; a.correct+=r.correct; a.total+=r.total; a.best=Math.max(a.best,r.score); a.streak=Math.max(a.streak,r.maxStreak||0); });
    const list=Object.values(agg).sort((a,b)=>b.best-a.best);
    body=`<div class="banner">※ 個人履歴は教員内部情報。学生には共有しない。</div>
      <table class="dash"><tr><th>名前</th><th class="n">T</th><th class="n">回数</th><th class="n">正解</th><th class="n">正答率</th><th class="n">最長連続</th><th class="n">ベスト点</th></tr>
      ${list.length?list.map(a=>`<tr><td>${esc(a.name)}</td><td class="n">${a.team}</td><td class="n">${a.plays}</td><td class="n">${a.correct}</td><td class="n">${a.total?Math.round(a.correct/a.total*100):0}%</td><td class="n">${a.streak}</td><td class="n">${a.best}</td></tr>`).join("")
        :`<tr><td colspan="7" class="muted">まだ回答がありません</td></tr>`}</table>`;
  }
  setScreen(`
    <div class="hd"><div class="t">🔒 教員ダッシュボード</div><span class="pill">${HAS_GAS?'クラス共有':'この端末のみ'}</span></div>
    <div class="seg" style="margin:8px 0">${tabs.map(([k,l])=>`<button class="${T.tab===k?'on':''}" onclick="T.tab='${k}';paintTeacher()">${l}</button>`).join("")}</div>

      <button class="btn sm ghost" onclick="exportCSV()">CSV出力</button>
      <button class="btn sm" style="background:var(--ng)" onclick="wipe()">データ全削除</button>
    </div>
    <button class="btn ghost sm" onclick="T.auth=true;go('home')">閉じる</button>
  `);
}
/* 個人ランキング：多彩な形式（得点/正答率/成長/応用正答率/連続/回数） */
function teacherRank(results){
  const agg={};
  results.forEach(r=>{ const a=agg[r.name]=agg[r.name]||{name:r.name,team:r.team,plays:0,correct:0,total:0,best:0,streak:0,
      first:null,last:null,appCorrect:0,appTotal:0};
    a.plays++; a.correct+=r.correct; a.total+=r.total; a.best=Math.max(a.best,r.score); a.streak=Math.max(a.streak,r.maxStreak||0);
    if(a.first==null||r.time<a.first.time) a.first={time:r.time,pct:r.pct};
    if(a.last==null||r.time>a.last.time) a.last={time:r.time,pct:r.pct};
    (r.answers||[]).forEach(x=>{ if(x.level==="応用"){ a.appTotal++; if(x.ok)a.appCorrect++; } });
  });
  let list=Object.values(agg);
  const rkDefs=[["score","スコア"],["acc","正答率"],["growth","成長(初→最新)"],["applied","応用正答率"],["streak","最長連続"],["plays","挑戦回数"]];
  const rk=T.rk;
  function val(a){
    if(rk==="score") return a.best;
    if(rk==="acc") return a.total?Math.round(a.correct/a.total*100):0;
    if(rk==="growth") return (a.first&&a.last)?(a.last.pct-a.first.pct):0;
    if(rk==="applied") return a.appTotal?Math.round(a.appCorrect/a.appTotal*100):0;
    if(rk==="streak") return a.streak;
    if(rk==="plays") return a.plays;
    return 0;
  }
  const unit = (rk==="acc"||rk==="applied")?"%":(rk==="growth")?"pt":(rk==="score")?"点":(rk==="streak")?"連続":"回";
  list=list.map(a=>({a,v:val(a)})).sort((x,y)=>y.v-x.v);
  const medal=["🥇","🥈","🥉"];
  return `<div class="banner">形式を切り替えて多角的に。学生には出さない教員専用ビュー。</div>
    <div class="seg" style="margin:6px 0">${rkDefs.map(([k,l])=>`<button class="${rk===k?'on':''}" onclick="T.rk='${k}';paintTeacher()">${l}</button>`).join("")}</div>
    <table class="dash"><tr><th>#</th><th>名前</th><th class="n">T</th><th class="n">${esc(rkDefs.find(d=>d[0]===rk)[1])}</th><th class="n">回数</th></tr>
    ${list.length?list.map((x,idx)=>`<tr><td>${medal[idx]||(idx+1)}</td><td>${esc(x.a.name)}</td><td class="n">${x.a.team}</td><td class="n"><b>${x.v}${unit}</b></td><td class="n">${x.a.plays}</td></tr>`).join("")
      :`<tr><td colspan="5" class="muted">まだ回答がありません</td></tr>`}</table>
    ${rk==="applied"?'<p class="muted" style="font-size:11px">※ 応用問題に挑戦した人のみ。分母は応用の解答数。</p>':''}
    ${rk==="growth"?'<p class="muted" style="font-size:11px">※ 最初のプレイと最新プレイの正答率差。伸びた人を可視化。</p>':''}`;
}
async function exportCSV(){
  const results=await Store.loadResults();
  let csv="name,team,block,level,mode,score,correct,total,pct,maxStreak,time\n";
  results.forEach(r=>{ csv+=[r.name,r.team,(r.blockName||r.block),r.level,r.mode,r.score,r.correct,r.total,r.pct,r.maxStreak,new Date(r.time).toLocaleString("ja-JP")].map(x=>`"${(""+x).replace(/"/g,'""')}"`).join(",")+"\n"; });
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="医療情報第7回_結果.csv"; a.click();
}
async function wipe(){ if(confirm("全データを削除します（授業前のリセット用）。よろしいですか？")){ await Store.clearAll(); alert("削除しました"); paintTeacher(); } }

  if(p.get("teacher")==="1"){ S.view="teacher"; }
  render();
}
boot();
</script>
