<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>腹部解剖 暗記ゲーム｜夜5回目</title>
<style>
  :root{
    --blue:#185FA5; --blue-d:#0f4176; --ok:#3B6D11; --ng:#A32D2D;
    --bg:#f4f6f9; --card:#ffffff; --ink:#1b2733; --sub:#5b6b7b; --line:#e2e8f0;
    --gold:#c8912a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1720; --card:#18232f; --ink:#e8eef4; --sub:#9fb0c0; --line:#2a3a4a; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; padding:0 14px 92px; position:relative;}
  h1,h2,h3{margin:0;}
  .muted{color:var(--sub);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:12px 0;
    box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .btn{display:block; width:100%; border:none; border-radius:12px; padding:14px; font-size:16px; font-weight:700;
    background:var(--blue); color:#fff; cursor:pointer; margin:8px 0; transition:transform .05s;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent; color:var(--blue); border:2px solid var(--blue);}
  .btn.sm{padding:10px; font-size:14px;}
  .choice{display:block; width:100%; text-align:left; border:2px solid var(--line); border-radius:12px;
    padding:14px; font-size:16px; background:var(--card); color:var(--ink); margin:8px 0; cursor:pointer; font-weight:600;}
  .choice:active{transform:scale(.99);}
  .choice.correct{border-color:var(--ok); background:rgba(59,109,17,.12); color:var(--ok);}
  .choice.wrong{border-color:var(--ng); background:rgba(163,45,45,.12); color:var(--ng);}
  .choice.dim{opacity:.5;}
  .brow{font-size:12px; letter-spacing:.12em; font-weight:800; color:var(--blue); text-transform:uppercase;}
  .pill{display:inline-block; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;
    background:rgba(24,95,165,.12); color:var(--blue); margin:2px 4px 2px 0;}
  .timerbar{height:8px; border-radius:999px; background:var(--line); overflow:hidden; margin:10px 0;}
  .timerbar > i{display:block; height:100%; background:var(--blue); width:100%; transition:width 1s linear;}
  .hd{display:flex; align-items:center; justify-content:space-between; padding:16px 2px 4px;}
  .hd .t{font-size:20px; font-weight:800;}
  .kpi{display:flex; gap:8px; flex-wrap:wrap;}
  .kpi .k{flex:1 1 30%; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center;}
  .kpi .k b{display:block; font-size:22px; color:var(--blue);}
  .kpi .k span{font-size:11px; color:var(--sub);}
  .nav{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; max-width:480px; margin:0 auto;}
  .nav button{flex:1; border:none; background:none; padding:8px 2px 10px; font-size:10px; font-weight:700;
    color:var(--sub); cursor:pointer;}
  .nav button .ic{display:block; font-size:20px; line-height:1.3;}
  .nav button.on{color:var(--blue);}
  input.txt{width:100%; padding:13px; border:2px solid var(--line); border-radius:12px; font-size:16px;
    background:var(--card); color:var(--ink);}
  select.txt{width:100%; padding:13px; border:2px solid var(--line); border-radius:12px; font-size:16px;
    background:var(--card); color:var(--ink);}
  .flash{min-height:200px; display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:22px; font-weight:800; padding:24px; cursor:pointer; user-select:none;}
  .flash small{display:block; font-size:13px; font-weight:600; color:var(--sub); margin-top:14px;}
  .row2{display:flex; gap:8px;}
  .row2 .btn{margin:8px 0;}
  .chip{display:inline-block; border:2px solid var(--blue); color:var(--blue); background:var(--card);
    border-radius:999px; padding:8px 14px; margin:4px; font-weight:700; cursor:pointer; font-size:15px;}
  .chip.used{opacity:.35; pointer-events:none;}
  .blank{display:inline-block; min-width:88px; border-bottom:3px solid var(--blue); text-align:center;
    font-weight:800; color:var(--blue); margin:0 3px; cursor:pointer;}
  .grow{font-size:15px; font-weight:800;}
  .grow.up{color:var(--ok);} .grow.same{color:var(--sub);}
  /* organ map */
  .organs{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .organ{border:2px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center; position:relative; overflow:hidden;}
  .organ .fill{position:absolute; left:0; bottom:0; width:100%; background:rgba(24,95,165,.18); transition:height .6s;}
  .organ.lit{border-color:var(--gold); box-shadow:0 0 0 2px rgba(200,145,42,.4);}
  .organ .em{font-size:26px; position:relative;}
  .organ .nm{font-size:12px; font-weight:700; position:relative; margin-top:2px;}
  .gauge{height:26px; border-radius:999px; background:var(--line); overflow:hidden;}
  .gauge > i{display:block; height:100%; background:linear-gradient(90deg,var(--blue),var(--ok)); width:0; transition:width .6s;}
  .teambar{display:flex; align-items:center; gap:8px; margin:6px 0;}
  .teambar .lab{width:64px; font-weight:800; font-size:13px;}
  .teambar .bwrap{flex:1; background:var(--line); border-radius:999px; height:22px; overflow:hidden;}
  .teambar .bwrap > i{display:block; height:100%; border-radius:999px; transition:width .5s;}
  .teambar .val{width:34px; text-align:right; font-weight:800; font-size:13px;}
  /* screen (projector) mode */
  body.screen #app{max-width:1100px; padding:24px 32px;}
  body.screen{font-size:20px;}
  body.screen .scr-title{font-size:34px; font-weight:900; text-align:center; margin:6px 0 18px;}
  body.screen .organ .em{font-size:52px;} body.screen .organ .nm{font-size:20px;}
  body.screen .teambar .lab{width:120px; font-size:22px;}
  body.screen .teambar .bwrap{height:40px;} body.screen .teambar .val{width:60px; font-size:22px;}
  body.screen .gauge{height:44px;}
  .banner{background:rgba(24,95,165,.1); border:1px dashed var(--blue); border-radius:12px; padding:10px 12px;
    font-size:13px; color:var(--blue); font-weight:700; margin:10px 0;}
  .award{display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:12px; padding:12px; margin:8px 0; background:var(--card);}
  .award .em{font-size:26px;}
  table.dash{width:100%; border-collapse:collapse; font-size:13px;}
  table.dash th,table.dash td{border-bottom:1px solid var(--line); padding:7px 6px; text-align:left;}
  table.dash td.n{text-align:right; font-variant-numeric:tabular-nums;}
  .barmini{height:8px; background:var(--line); border-radius:4px; overflow:hidden;}
  .barmini>i{display:block; height:100%; background:var(--ng);}
</style>
</head>

async function gasPost(payload){
  try{ const r=await fetch(GAS_URL,{method:"POST",body:JSON.stringify(payload)}); return await r.json(); }

}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let F={};
function startFlash(b){ F={ cards:shuffle(CARDS.filter(c=>c.block===b)), i:0, flip:false, again:[], block:b }; drawFlash(); }
function drawFlash(){

function flipCard(){ F.flip=!F.flip; drawFlash(); }
function markCard(ok){ if(!ok) F.again.push(F.cards[F.i]); F.i++; F.flip=false; drawFlash(); }

let C={};
function startCloze(b){ const list=shuffle(CLOZE.filter(c=>c.block===b)); C={list,i:0,block:b}; drawCloze(); }
function drawCloze(){
  if(C.i>=C.list.length){ setScreen(`<div class="hd"><div class="t">✅ ${esc(C.block)} 穴埋め完了</div></div><div class="card" style="text-align:center"><p style="font-size:40px">🧠</p><p>流れごと言えるように！</p></div><button class="btn" onclick="go('quiz')">⏱️ クイズで試す</button><button class="btn ghost" onclick="go('memo')">暗記メニューへ</button>`); return; }
  const it=C.list[C.i]; C.filled=[]; C.bank=shuffle(it.blanks.slice());
  paintCloze();
}
function paintCloze(){
  const it=C.list[C.i]; let sent="";
  it.parts.forEach((p,idx)=>{
    sent+=esc(p);
    if(idx<it.blanks.length){
      const v=C.filled[idx];
      sent+=`<span class="blank" onclick="unfill(${idx})">${v?esc(v):"　？　"}</span>`;
    }
  });
  const done=C.filled.filter(Boolean).length===it.blanks.length;
  setScreen(`
    <div class="hd"><div class="t">✍️ ${esc(C.block)}</div><span class="pill">${C.i+1} / ${C.list.length}</span></div>
    <div class="card" style="font-size:17px;line-height:2.1">${sent}</div>
    <div class="card"><div class="muted" style="font-size:12px;margin-bottom:6px">下の語を空欄に順番にタップ</div>
      ${C.bank.map((w,bi)=>`<span class="chip ${C.filled.includes(w)?'used':''}" onclick="fill('${esc(w)}')">${esc(w)}</span>`).join("")}
    </div>
    ${done?`<button class="btn" onclick="checkCloze()">こたえ合わせ</button>`:``}
    <button class="btn ghost sm" onclick="go('memo')">やめる</button>
  `);
}
function fill(w){ const it=C.list[C.i]; const idx=C.filled.length; if(idx<it.blanks.length){ C.filled[idx]=w; paintCloze(); } }
function unfill(idx){ if(C.filled[idx]!==undefined){ C.filled.splice(idx,1); paintCloze(); } }
function checkCloze(){
  const it=C.list[C.i]; const ok=it.blanks.every((b,i)=>C.filled[i]===b);
  let sent="";
  it.parts.forEach((p,idx)=>{ sent+=esc(p); if(idx<it.blanks.length){ const right=it.blanks[idx], got=C.filled[idx];
    sent+=`<span class="blank" style="color:${got===right?'var(--ok)':'var(--ng)'};border-color:${got===right?'var(--ok)':'var(--ng)'}">${esc(right)}</span>`; }});
  setScreen(`
    <div class="hd"><div class="t">${ok?'⭕ 正解！':'もう一度'}</div></div>
    <div class="card" style="font-size:17px;line-height:2.1">${sent}</div>
    <button class="btn" onclick="C.i++;drawCloze()">次へ ▶</button>
    ${ok?'':'<button class="btn ghost" onclick="drawCloze()">この問題をやり直す</button>'}
  `);
}

/* ============================================================
   クイズエンジン（個人TA / チーム戦 / 協力 で共有）
   mode: "solo" | "team" | "coop"
   ============================================================ */
let Q={};
function shuffleChoices(q){
  const order=shuffle(q.choices.map((_,i)=>i));
  const choices=order.map(i=>q.choices[i]);
  const ans = q.type==="multi" ? q.ans.map(a=>order.indexOf(a)) : order.indexOf(q.ans);
  return Object.assign({},q,{choices,ans});
}
function startQuiz(mode, block){
  let base = block==="総合" ? shuffle(QUESTIONS).slice(0, mode==="solo"?10:8) : shuffle(byBlock(block));
  let pool = base.map(shuffleChoices);
  Q={ mode, block, qs:pool, i:0, correct:0, score:0, streak:0, maxStreak:0, answers:[], sel:[], locked:false };
  nextQuiz();
}
function nextQuiz(){
  if(Q.i>=Q.qs.length){ endQuiz(); return; }
  Q.sel=[]; Q.locked=false; Q.timeLeft=TIME_LIMIT; Q.started=Date.now();
  paintQuiz();
  if(Q.timer) clearInterval(Q.timer);
  Q.timer=setInterval(()=>{
    Q.timeLeft--; const bar=$("tbar"); if(bar) bar.style.width=Math.max(0,Q.timeLeft/TIME_LIMIT*100)+"%";
    if(Q.timeLeft<=0){ clearInterval(Q.timer); if(!Q.locked) lockAnswer(true); }
  },1000);
}
function paintQuiz(){
  const q=Q.qs[Q.i]; const multi=q.type==="multi";
  const label={solo:"⏱️ 個人タイムアタック",team:"⚔️ チーム戦",coop:"🤝 協力"}[Q.mode];
  setScreen(`
    <div class="hd"><div class="t">${label}</div><span class="pill">${esc(q.block)} ${Q.i+1}/${Q.qs.length}</span></div>
    <div class="timerbar"><i id="tbar"></i></div>
    <div class="card"><h3 style="font-size:17px;line-height:1.5">${esc(q.q)}</h3>
      ${multi?'<p class="muted" style="font-size:12px;margin:6px 0 0">▼ あてはまるものを全部えらぶ</p>':''}</div>
    ${(q.imgIdx!=null && IMAGES[q.imgIdx])?`<div class="card" style="padding:6px;text-align:center"><img src="${IMAGES[q.imgIdx]}" alt="図" style="max-width:100%;max-height:200px;border-radius:8px"></div>`:""}
    <div id="choices">
      ${q.choices.map((c,idx)=>`<button class="choice" data-i="${idx}" onclick="pick(${idx})">${esc(c)}</button>`).join("")}
    </div>
    ${multi?'<button class="btn" onclick="lockAnswer(false)">決定</button>':''}
  `);
  requestAnimationFrame(()=>{ const b=$("tbar"); if(b){ b.style.transition="none"; b.style.width="100%"; requestAnimationFrame(()=>{ b.style.transition="width 1s linear"; }); }});
}
function pick(idx){
  const q=Q.qs[Q.i];
  if(Q.locked) return;
  if(q.type==="multi"){
    const p=Q.sel.indexOf(idx); if(p>=0) Q.sel.splice(p,1); else Q.sel.push(idx);
    document.querySelectorAll("#choices .choice").forEach(el=>{ const i=+el.dataset.i; el.classList.toggle("correct", Q.sel.includes(i)); });
  }else{ Q.sel=[idx]; lockAnswer(false); }
}
function lockAnswer(timeout){
  if(Q.locked) return; Q.locked=true; if(Q.timer) clearInterval(Q.timer);
  const q=Q.qs[Q.i];
  const ansArr = q.type==="multi" ? q.ans.slice() : [q.ans];
  const ok = !timeout && Q.sel.length===ansArr.length && Q.sel.every(i=>ansArr.includes(i));
  // 表示
  document.querySelectorAll("#choices .choice").forEach(el=>{ const i=+el.dataset.i;
    el.classList.remove("correct","wrong");
    if(ansArr.includes(i)) el.classList.add("correct");
    else if(Q.sel.includes(i)) el.classList.add("wrong");
    else el.classList.add("dim");
    el.setAttribute("onclick","");
  });
  // 採点
  if(ok){
    Q.correct++; Q.streak++; Q.maxStreak=Math.max(Q.maxStreak,Q.streak);
    const third=Math.floor(TIME_LIMIT/3);
    const bonus = Q.timeLeft>=(third*2)?30 : Q.timeLeft>=third?20 : 10;
    const sbonus = Math.min(Q.streak-1,5)*2;
    Q.score += bonus + sbonus;
  }else{ Q.streak=0; }
  Q.answers.push({id:q.id, block:q.block, ok});
  const fb=document.createElement("div"); fb.className="card"; fb.style.textAlign="center";
  fb.style.borderColor = ok?"var(--ok)":"var(--ng)";
  fb.innerHTML = ok?`<b style="color:var(--ok);font-size:18px">⭕ 正解！ +${(function(){const third=Math.floor(TIME_LIMIT/3);const b=Q.timeLeft>=(third*2)?30:Q.timeLeft>=third?20:10;return b+Math.min(Q.streak-1,5)*2;})()}点</b>${Q.streak>1?` <span class="pill">${Q.streak}連続🔥</span>`:''}`
    : `<b style="color:var(--ng);font-size:18px">${timeout?'⏰ 時間切れ':'✗ ざんねん'}</b>`;
  $("screen").appendChild(fb);
  setTimeout(()=>{ Q.i++; nextQuiz(); }, ok?800:1200);
}
async function endQuiz(){
  if(Q.timer) clearInterval(Q.timer);
  const pct=Math.round(Q.correct/Q.qs.length*100);
  const rec={ name:S.user, team:S.team, block:Q.block, mode:Q.mode, score:Q.score, correct:Q.correct,
    total:Q.qs.length, pct, maxStreak:Q.maxStreak, time:Date.now(), answers:Q.answers };
  await Store.saveResult(rec);

  if(Q.mode==="team"){
    await Store.addTeam(S.team, Q.correct, organOf(Q.block));
    setScreen(`
      <div class="hd"><div class="t">⚔️ チームに加点！</div><span class="pill">チーム${S.team}</span></div>
      <div class="card" style="text-align:center"><p style="font-size:40px;margin:4px">➕${Q.correct}</p>
        <p>あなたの正解 <b>${Q.correct}/${Q.qs.length}</b> がチーム${S.team}に入りました。</p>
        <p class="muted" style="font-size:13px">前のスクリーンでチーム順位と器官の点灯を見よう！</p></div>
      <button class="btn" onclick="go('team')">もう1ラウンド</button>
      <button class="btn ghost" onclick="go('home')">ホームへ</button>`);
    return;
  }
  if(Q.mode==="coop"){
    await Store.addCoop(Q.correct);
    const total=await Store.loadCoop();
    setScreen(`
      <div class="hd"><div class="t">🤝 クラスに貢献！</div></div>
      <div class="card" style="text-align:center"><p style="font-size:40px;margin:4px">➕${Q.correct}</p>
        <p>あなたの正解がクラス合計に加わりました。</p></div>
      ${gaugeHtml(total)}
      <button class="btn" onclick="go('coop')">もう1ラウンド</button>
      <button class="btn ghost" onclick="go('home')">ホームへ</button>`);
    return;
  }
  // solo: 過去比の伸びのみ（順位は出さない）
  const key="best_"+Q.block;
  const prev=LS.get(key,null);
  let growth="";
  if(prev==null){ growth=`<div class="grow same">はじめての記録！ 次はこれを超えよう</div>`; }
  else if(Q.correct>prev.correct){ growth=`<div class="grow up">⬆ 前回より +${Q.correct-prev.correct}問！ 伸びてる</div>`; }
  else if(Q.correct===prev.correct){ growth=`<div class="grow same">前回と同じ（${Q.correct}問）。あと1問！</div>`; }
  else { growth=`<div class="grow same">今回 ${Q.correct}問（自己ベスト ${prev.correct}問）。もう一回いこう</div>`; }
  if(prev==null || Q.correct>prev.correct || (Q.correct===prev.correct && Q.score>(prev.score||0))) LS.set(key,{correct:Q.correct,score:Q.score});
  setScreen(`
    <div class="hd"><div class="t">結果</div><span class="pill">${esc(Q.block)}</span></div>
    <div class="kpi">
      <div class="k"><b>${Q.correct}/${Q.qs.length}</b><span>正解</span></div>
      <div class="k"><b>${pct}%</b><span>正答率</span></div>
      <div class="k"><b>${Q.maxStreak}</b><span>最大連続</span></div>
    </div>
    <div class="card" style="text-align:center">${growth}
      <p class="muted" style="font-size:12px;margin-top:8px">※ 個人の順位は出していません。競うのは「昨日の自分」です。</p></div>
    <button class="btn" onclick="startQuiz('solo','${Q.block}')">もう一度（自己ベスト更新）</button>
    <button class="btn ghost" onclick="go('quiz')">別の範囲へ</button>
  `);
}

/* ---------- クイズ（個人TA）メニュー ---------- */
function renderQuizHome(){
  setScreen(`
    <div class="hd"><div class="t">⏱️ 個人タイムアタック</div><span class="pill">30秒/問・速いほど高得点</span></div>
    <div class="banner">覚えた直後にどうぞ。順位は出ません。「自己ベスト更新」だけを狙おう。</div>
    <button class="btn" onclick="startQuiz('solo','総合')">🎲 総合ミックス（10問・分野混合）</button>
    ${BLOCKS.map(b=>{ const best=LS.get("best_"+b,null);
      return `<button class="btn ghost" onclick="startQuiz('solo','${b}')">${esc(b)}（${byBlock(b).length}問）${best?` <span style="font-size:12px;color:var(--ok)">自己ベスト${best.correct}</span>`:''}</button>`;}).join("")}
  `);
}

/* ---------- チーム戦メニュー ---------- */
function renderTeamHome(){
  setScreen(`
    <div class="hd"><div class="t">⚔️ チーム戦</div><span class="pill">チーム${S.team}</span></div>
    <div class="banner">先生が言った範囲を全員で一斉に。あなたの正解が<b>チーム${S.team}</b>の得点になります。スクリーンで順位と器官の点灯を見よう！</div>
    <p class="muted" style="font-size:13px;font-weight:700;margin:12px 2px 4px">▼ 先生の合図で範囲をえらぶ</p>
    ${BLOCKS.map(b=>`<button class="btn ghost" onclick="startQuiz('team','${b}')">${esc(b)}</button>`).join("")}
    <button class="btn" onclick="startQuiz('team','総合')">🎲 総合ミックス</button>
  `);
}

/* ---------- 協力メニュー ---------- */
async function renderCoopHome(){
  const total=await Store.loadCoop();
  setScreen(`
    <div class="hd"><div class="t">🤝 協力モード</div></div>
    <div class="banner">クラス全員の正解を合計して、目標 <b>${COOP_TARGET}</b> を達成すればクラス勝利！ 速い遅いは関係なし、1問正解＝1貢献。</div>
    ${gaugeHtml(total)}
    <button class="btn" style="background:var(--ok)" onclick="startQuiz('coop','総合')">🎲 総合ミックスで貢献する</button>
    ${BLOCKS.map(b=>`<button class="btn ghost" onclick="startQuiz('coop','${b}')">${esc(b)}</button>`).join("")}
  `);
}
function gaugeHtml(total){
  const pct=Math.min(100, Math.round(total/COOP_TARGET*100));
  return `<div class="card"><div style="display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px">
      <span>クラス合計</span><span>${total} / ${COOP_TARGET}${pct>=100?' 🎉達成！':''}</span></div>
    <div class="gauge"><i style="width:${pct}%"></i></div></div>`;
}

/* ============================================================
   スクリーンビュー（プロジェクタ投影）  URL: ?screen=1
   4秒ごとにチーム合算・器官点灯・協力ゲージを更新
   ============================================================ */
async function renderScreen(){
  const teams=await Store.loadTeams();
  const organs=await Store.loadOrgans();
  const coop=await Store.loadCoop();
  const max=Math.max(10, ...Object.values(teams).map(Number));
  let bars="";
  for(let i=1;i<=TEAM_COUNT;i++){ const v=teams[i]||0; const w=Math.round(v/max*100);
    bars+=`<div class="teambar"><div class="lab">チーム${i}</div>
      <div class="bwrap"><i style="width:${w}%;background:${TEAM_COLORS[(i-1)%TEAM_COLORS.length]}"></i></div>
      <div class="val">${v}</div></div>`; }
  const LIT=8; // 器官ごと「点灯」に必要な正解数（クラス合計）
  const organCells=ORGANS.map(o=>{ const v=organs[o.key]||0; const h=Math.min(100, v/LIT*100); const lit=v>=LIT;
    return `<div class="organ ${lit?'lit':''}"><div class="fill" style="height:${h}%"></div>
      <div class="em">${o.em}</div><div class="nm">${o.nm}${lit?' ✨':''}</div></div>`; }).join("");
  const litCount=ORGANS.filter(o=>(organs[o.key]||0)>=LIT).length;
  const gpct=Math.min(100,Math.round(coop/COOP_TARGET*100));
  setScreen(`
    <div class="scr-title">⚔️ 腹部CT争奪戦　＜夜5回目＞</div>
    <div class="card"><h3 style="margin-bottom:10px">チーム得点</h3>${bars}</div>
    <div class="card"><h3 style="margin-bottom:10px">器官コンプリート（${litCount}/${ORGANS.length} 点灯）</h3>
      <div class="organs">${organCells}</div></div>
    <div class="card"><h3 style="margin-bottom:10px">🤝 クラス協力ゲージ ${coop} / ${COOP_TARGET}${gpct>=100?' 🎉':''}</h3>
      <div class="gauge"><i style="width:${gpct}%"></i></div></div>
    <p class="muted" style="text-align:center;font-size:14px">自動更新中… 学生のスマホからの回答が反映されます</p>
  `);
}

/* ============================================================
   教員ダッシュボード（パスワード）
   ============================================================ */
let T={auth:false, tab:"teams"};
function renderTeacher(){
  if(!T.auth){
    setScreen(`<div class="hd"><div class="t">🔒 教員ダッシュボード</div></div>
      <div class="card"><input class="txt" id="pw" type="password" placeholder="パスワード" style="margin-bottom:10px">
      <button class="btn" onclick="authT()">開く</button></div>
      <p class="muted" style="font-size:12px">※ 個人の順位・得点はここ（教員）だけで確認します。学生画面には出しません。</p>`);
    return;
  }
  paintTeacher();
}
function authT(){ if($("pw").value===ADMIN_PW){ T.auth=true; paintTeacher(); } else alert("パスワードが違います"); }
async function paintTeacher(){
  const results=await Store.loadResults();
  const teams=await Store.loadTeams();
  const coop=await Store.loadCoop();
  const tabs=[["teams","チーム/概況"],["items","問題別正答率"],["students","個人（内部）"]];
  let body="";
  if(T.tab==="teams"){
    const players=new Set(results.map(r=>r.name)).size;
    body=`<div class="kpi"><div class="k"><b>${players}</b><span>参加人数</span></div>
      <div class="k"><b>${results.length}</b><span>プレイ回数</span></div>
      <div class="k"><b>${coop}</b><span>協力合計</span></div></div>
      <div class="card"><h3>チーム得点</h3>${Array.from({length:TEAM_COUNT},(_,i)=>`<div class="teambar"><div class="lab">チーム${i+1}</div><div class="bwrap"><i style="width:${Math.round((teams[i+1]||0)/Math.max(1,Math.max(...Object.values(teams).map(Number),1))*100)}%;background:${TEAM_COLORS[i%TEAM_COLORS.length]}"></i></div><div class="val">${teams[i+1]||0}</div></div>`).join("")}</div>
      <p class="muted" style="font-size:12px">スクリーン投影は <b>?screen=1</b> を付けたURLを別タブで開く</p>`;
  }
  else if(T.tab==="items"){
    const stat={};
    results.forEach(r=>r.answers.forEach(a=>{ stat[a.id]=stat[a.id]||{ok:0,n:0}; stat[a.id].n++; if(a.ok)stat[a.id].ok++; }));
    const rows=QUESTIONS.map(q=>{ const s=stat[q.id]||{ok:0,n:0}; const p=s.n?Math.round(s.ok/s.n*100):null; return {q,p,n:s.n}; })
      .filter(r=>r.n>0).sort((a,b)=>a.p-b.p);
    body=`<div class="banner">正答率が低い順（デブリーフはこのTOP5から）</div>
      <table class="dash"><tr><th>問題</th><th class="n">正答率</th><th class="n">n</th></tr>
      ${rows.length?rows.map((r,idx)=>`<tr><td>${idx<5?'🔴 ':''}<b>${esc(r.q.block)}</b> ${esc(r.q.q.slice(0,22))}…</td>
        <td class="n">${r.p}%<div class="barmini"><i style="width:${r.p}%"></i></div></td><td class="n">${r.n}</td></tr>`).join("")
        :`<tr><td colspan="3" class="muted">まだ回答がありません</td></tr>`}</table>`;
  }
  else{
    const agg={};
    results.forEach(r=>{ agg[r.name]=agg[r.name]||{name:r.name,team:r.team,plays:0,correct:0,best:0}; const a=agg[r.name]; a.plays++; a.correct+=r.correct; a.best=Math.max(a.best,r.score); });
    const list=Object.values(agg).sort((a,b)=>b.best-a.best);
    body=`<div class="banner">※ 個人の順位は教員内部情報。学生には共有しない。</div>
      <table class="dash"><tr><th>名前</th><th class="n">T</th><th class="n">回数</th><th class="n">累計正解</th><th class="n">ベスト点</th></tr>
      ${list.length?list.map(a=>`<tr><td>${esc(a.name)}</td><td class="n">${a.team}</td><td class="n">${a.plays}</td><td class="n">${a.correct}</td><td class="n">${a.best}</td></tr>`).join("")
        :`<tr><td colspan="5" class="muted">まだ回答がありません</td></tr>`}</table>`;
  }
  setScreen(`
    <div class="hd"><div class="t">🔒 教員ダッシュボード</div></div>
    <div class="row2" style="flex-wrap:wrap">${tabs.map(([k,l])=>`<button class="btn sm ${T.tab===k?'':'ghost'}" style="flex:1" onclick="T.tab='${k}';paintTeacher()">${l}</button>`).join("")}</div>
    ${body}
    <div class="row2" style="margin-top:10px">
      <button class="btn sm ghost" onclick="exportCSV()">CSV出力</button>
      <button class="btn sm" style="background:var(--ng)" onclick="wipe()">データ全削除</button>
    </div>
    <button class="btn ghost sm" onclick="go('home')">閉じる</button>
  `);
}
async function exportCSV(){
  const results=await Store.loadResults();
  let csv="name,team,block,mode,score,correct,total,pct,maxStreak,time\n";
  results.forEach(r=>{ csv+=[r.name,r.team,r.block,r.mode,r.score,r.correct,r.total,r.pct,r.maxStreak,new Date(r.time).toLocaleString("ja-JP")].map(x=>`"${x}"`).join(",")+"\n"; });
  const blob=new Blob([csv],{type:"text/csv"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="腹部解剖ゲーム結果.csv"; a.click();
}
async function wipe(){ if(confirm("全データを削除します。よろしいですか？")){ await Store.clearAll(); alert("削除しました"); paintTeacher(); } }

/* ============================================================
   起動
   ============================================================ */
function boot(){
  const p=new URLSearchParams(location.search);
  if(p.get("screen")==="1"){ document.body.classList.add("screen"); S.screen=true; renderScreen(); setInterval(renderScreen, 4000); return; }
  if(p.get("teacher")==="1"){ S.view="teacher"; }
  render();
}
boot();
</script>
